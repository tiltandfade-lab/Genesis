<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="rpt rpd" font-family="ui-sans-serif, -apple-system, 'Segoe UI', sans-serif">
<title id="rpt">Guard-post roof postures — the five candidate stances</title>
<desc id="rpd">Five side elevations of the same guard-post mass with different roof postures: shed lean-to, gable, flat deck with parapet lookout, canopy over the terrace, and intentionally open platform.</desc>
<rect x="0" y="0" width="640" height="320" fill="#FFFFFF"/>
<line x1="16" y1="240" x2="624" y2="240" stroke="#888780"/>
<rect x="30" y="150" width="70" height="90" fill="#D3D1C7" stroke="#888780"/>
<polygon points="22,150 104,122 104,112 22,140" fill="#F0997B" stroke="#993C1D"/>
<text x="65" y="264" font-size="12" fill="#444441" text-anchor="middle">shed lean-to</text>
<text x="65" y="280" font-size="11" fill="#5F5E5A" text-anchor="middle">one plane, vernacular</text>
<rect x="152" y="150" width="70" height="90" fill="#D3D1C7" stroke="#888780"/>
<polygon points="144,150 187,110 230,150" fill="#F0997B" stroke="#993C1D"/>
<text x="187" y="264" font-size="12" fill="#444441" text-anchor="middle">gable</text>
<text x="187" y="280" font-size="11" fill="#5F5E5A" text-anchor="middle">domestic silhouette</text>
<rect x="274" y="150" width="70" height="90" fill="#D3D1C7" stroke="#888780"/>
<rect x="274" y="134" width="12" height="16" fill="#D3D1C7" stroke="#888780"/>
<rect x="332" y="134" width="12" height="16" fill="#D3D1C7" stroke="#888780"/>
<rect x="288" y="146" width="42" height="5" fill="#5DCAA5" stroke="#0F6E56"/>
<circle cx="309" cy="128" r="5" fill="#444441"/>
<line x1="309" y1="133" x2="309" y2="146" stroke="#444441" stroke-width="3"/>
<text x="309" y="264" font-size="12" font-weight="700" fill="#0F6E56" text-anchor="middle">MVP: flat deck + edge</text>
<text x="309" y="280" font-size="11" fill="#5F5E5A" text-anchor="middle">the roof is the lookout</text>
<rect x="396" y="150" width="70" height="90" fill="#D3D1C7" stroke="#888780"/>
<rect x="392" y="140" width="78" height="10" fill="#F0997B" stroke="#993C1D"/>
<polygon points="466,150 530,158 530,148 466,140" fill="#F0997B" stroke="#993C1D"/>
<line x1="524" y1="154" x2="524" y2="240" stroke="#5F5E5A" stroke-width="3"/>
<text x="452" y="264" font-size="12" fill="#444441" text-anchor="middle">canopy over terrace</text>
<text x="452" y="280" font-size="11" fill="#5F5E5A" text-anchor="middle">covers the gate side</text>
<rect x="548" y="150" width="70" height="90" fill="#D3D1C7" stroke="#888780"/>
<line x1="548" y1="150" x2="618" y2="150" stroke="#888780" stroke-dasharray="6 5"/>
<text x="583" y="264" font-size="12" fill="#444441" text-anchor="middle">open platform</text>
<text x="583" y="280" font-size="11" fill="#5F5E5A" text-anchor="middle">no weather shell</text>
<text x="320" y="32" font-size="14" fill="#2C2C2A" text-anchor="middle">
  <tspan x="320" dy="0">Roof posture — the stance toward weather</tspan>
  <tspan x="320" dy="17">and observation</tspan>
</text>
<text x="320" y="300" font-size="9.5" fill="#5F5E5A" text-anchor="middle">
  <tspan x="320" dy="0">MVP invariant: both cultures grant the same raised-observation and cover promise.</tspan>
  <tspan x="320" dy="12">Construction may differ; tactical advantage may not.</tspan>
</text>
</svg>
