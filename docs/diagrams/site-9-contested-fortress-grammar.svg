  <g font-size="12.5" fill="#3a3f48">
    <text x="600" y="754">One persistent <tspan font-weight="700" font-family="Menlo, Consolas, monospace" font-size="12">siteId</tspan> · one <tspan font-weight="700" font-family="Menlo, Consolas, monospace" font-size="12">windowSetId</tspan> · byte-equivalent wall geometry,</text>
    <text x="600" y="774">damage facts and holder attribution shared across both windows.</text>
    <text x="600" y="800">This is the property nothing else in the portfolio proves — and the reason Site 9 is a</text>
    <text x="600" y="820"><tspan font-weight="700">scale/relationship stress case</tspan>, not a bigger Guard Post. FFT built Bethla Garrison as</text>
  </g>
  <text x="600" y="840" font-size="12.5" fill="#3a3f48"><tspan font-weight="700">five</tspan> maps — sluice, granary, south wall, north wall, council chamber — for exactly this reason.</text>

  <!-- ============================================================ -->
  <!-- PANEL D — boundaries                                          -->
  <!-- ============================================================ -->
  <rect x="40" y="862" width="1160" height="112" fill="#efece4" stroke="#c3bcae" stroke-width="1.2"/>
  <text x="56" y="886" font-size="13" font-weight="700" fill="#20242b">D · BOUNDARIES — the test that keeps Site 9 out of its neighbours</text>

  <text x="56" y="910" font-size="12" fill="#3a3f48"><tspan font-weight="700" fill="#8a5230">vs SITE 8 (layered control):</tspan> Site 8 asks <tspan font-style="italic">who really controls this</tspan> — concealment, recognition, hidden claims; it survives at any map size.</text>
  <text x="56" y="928" font-size="12" fill="#3a3f48">Site 9 asks <tspan font-style="italic">who holds which ground right now</tspan> — open, territorial, at a scale that exceeds one materialization window.</text>
  <text x="56" y="950" font-size="12" font-weight="700" fill="#b5442e">Remove the concealment and Site 8 collapses. Remove the second population's ground and Site 9 collapses.</text>
  <text x="56" y="966" font-size="12" fill="#8a3524">A besieged castle with a traitor in the gatehouse is BOTH — and that compose is worth supporting.</text>

  <line x1="880" y1="898" x2="880" y2="962" stroke="#c3bcae" stroke-width="1.2"/>
  <text x="900" y="910" font-size="11.5" fill="#3a3f48"><tspan font-weight="700">vs SITE 1:</tspan> controls a transition, not ground.</text>
  <text x="900" y="928" font-size="11.5" fill="#3a3f48"><tspan font-weight="700">vs SITE 3:</tspan> no claimant left = dormant.</text>
  <text x="900" y="946" font-size="11.5" fill="#3a3f48"><tspan font-weight="700">vs SITE 10:</tspan> Site 9 owns the envelope;</text>
  <text x="900" y="962" font-size="11.5" fill="#3a3f48">Site 10 owns what it encloses.</text>
