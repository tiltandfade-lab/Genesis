<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 700" width="1060" height="700" font-family="Helvetica, Arial, sans-serif">
  <title>Camp Study lane 1 — tent-form silhouettes at one scale</title>
  <desc>Nine tent forms drawn at a shared scale against the Genesis vertical quantum h = 2.5 ft.
  Reference-derived schematic diagram, not a production asset.</desc>

  <rect x="0" y="0" width="1060" height="700" fill="#f6f3ec"/>

  <text x="30" y="38" font-size="20" font-weight="bold" fill="#23201b">Tent-form silhouettes — one scale, one ground line</text>
  <text x="30" y="60" font-size="12.5" fill="#5a544a">Genesis grid: 1 cell = 5 ft · vertical quantum h = 2.5 ft · storey = 4h = 10 ft. Schematic; derived from the lane-1 reference contact sheet.</text>

  <!-- ============ ROW A : CONE + DRUM ============ -->
  <text x="30" y="96" font-size="13" font-weight="bold" fill="#7a5c2e">GENUS: CONE  (apex over a round base)  ·  and DRUM</text>

  <!-- quantum ruler row A : ground y=300 -->
  <g stroke="#c9c1b2" stroke-width="1">
    <line x1="34" y1="300" x2="1030" y2="300" stroke="#8b8375" stroke-width="1.5"/>
    <line x1="34" y1="282" x2="1030" y2="282" stroke-dasharray="3 6"/>
    <line x1="34" y1="264" x2="1030" y2="264" stroke-dasharray="3 6"/>
    <line x1="34" y1="246" x2="1030" y2="246" stroke-dasharray="3 6"/>
    <line x1="34" y1="228" x2="1030" y2="228" stroke-dasharray="3 6"/>
    <line x1="34" y1="210" x2="1030" y2="210" stroke-dasharray="3 6"/>
    <line x1="34" y1="192" x2="1030" y2="192" stroke-dasharray="3 6"/>
  </g>
  <g font-size="9.5" fill="#8b8375">
    <text x="12" y="285">1h</text><text x="12" y="249">3h</text><text x="12" y="213">5h</text><text x="12" y="195">6h</text>
  </g>

  <!-- 1 TIPI : base 4 cells (144), 6h = 108 -->
  <g>
    <polygon points="58,300 202,300 130,192" fill="#8e8577" stroke="#4a453d" stroke-width="1.5"/>
    <!-- projecting pole crown : THE signal -->
    <g stroke="#3b352d" stroke-width="2" stroke-linecap="round">
      <line x1="130" y1="192" x2="112" y2="160"/>
      <line x1="130" y1="192" x2="124" y2="154"/>
      <line x1="130" y1="192" x2="137" y2="156"/>
      <line x1="130" y1="192" x2="149" y2="163"/>
      <line x1="130" y1="192" x2="119" y2="167"/>
    </g>
    <!-- smoke flap poles leaning outside -->
    <g stroke="#3b352d" stroke-width="1.6" stroke-linecap="round">
      <line x1="96" y1="300" x2="121" y2="172"/>
      <line x1="166" y1="300" x2="141" y2="172"/>
    </g>
    <!-- door notch (paint) -->
    <path d="M122,300 L122,272 Q130,262 138,272 L138,300 Z" fill="#3b352d" opacity="0.75"/>
    <text x="130" y="326" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#23201b">TIPI</text>
    <text x="130" y="342" font-size="10" text-anchor="middle" fill="#5a544a">4 cells · 6h + crown</text>
    <text x="130" y="356" font-size="10" text-anchor="middle" fill="#7a5c2e">signal: projecting pole crown</text>
  </g>

  <!-- 2 LAVVU : 3 cells (108), 3h = 54, bowed -->
  <g>
    <path d="M266,300 Q290,262 320,246 Q350,262 374,300 Z" fill="#8e8577" stroke="#4a453d" stroke-width="1.5"/>
    <g stroke="#3b352d" stroke-width="1.8" stroke-linecap="round">
      <line x1="320" y1="246" x2="310" y2="228"/>
      <line x1="320" y1="246" x2="322" y2="224"/>
      <line x1="320" y1="246" x2="332" y2="230"/>
    </g>
    <path d="M313,300 L313,278 Q320,270 327,278 L327,300 Z" fill="#3b352d" opacity="0.75"/>
    <text x="320" y="326" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#23201b">LAVVU</text>
    <text x="320" y="342" font-size="10" text-anchor="middle" fill="#5a544a">3 cells · 3h + stub</text>
    <text x="320" y="356" font-size="10" text-anchor="middle" fill="#7a5c2e">signal: squat bowed profile</text>
  </g>

  <!-- 3 BELL / SIBLEY : 4 cells (144), 5h = 90, 1h skirt -->
  <g>
    <polygon points="438,300 438,282 510,210 582,282 582,300" fill="#d9d2c2" stroke="#4a453d" stroke-width="1.5"/>
    <line x1="438" y1="282" x2="582" y2="282" stroke="#4a453d" stroke-width="1" stroke-dasharray="4 3"/>
    <polygon points="498,300 510,246 522,300" fill="#3b352d" opacity="0.7"/>
    <text x="510" y="326" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#23201b">BELL / SIBLEY</text>
    <text x="510" y="342" font-size="10" text-anchor="middle" fill="#5a544a">4 cells · 5h</text>
    <text x="510" y="356" font-size="10" text-anchor="middle" fill="#7a5c2e">signal: base skirt break, bare point</text>
  </g>

  <!-- 4 PAVILION : 5 cells (180), wall 2h, apex 5h, finial -->
  <g>
    <polygon points="655,300 655,264 700,210 745,264 745,300" fill="#c8b4d6" stroke="#4a453d" stroke-width="1.5"/>
    <!-- gore stripes = PAINT -->
    <g fill="#8f6ea8" opacity="0.85">
      <polygon points="700,210 712,246 712,300 694,300 694,246"/>
      <polygon points="700,212 727,246 727,282 719,282 719,246"/>
      <polygon points="700,212 673,246 673,282 681,282 681,246"/>
    </g>
    <line x1="655" y1="264" x2="745" y2="264" stroke="#4a453d" stroke-width="1" stroke-dasharray="4 3"/>
    <!-- finial + pennant : signal -->
    <line x1="700" y1="210" x2="700" y2="192" stroke="#3b352d" stroke-width="2.2"/>
    <circle cx="700" cy="190" r="3.4" fill="#3b352d"/>
    <path d="M703,186 L730,192 L703,198 Z" fill="#a33b2f"/>
    <!-- stake stubs (the guy-line compromise) -->
    <g stroke="#6b6255" stroke-width="1.6">
      <line x1="640" y1="300" x2="637" y2="292"/><line x1="760" y1="300" x2="763" y2="292"/>
    </g>
    <text x="700" y="326" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#23201b">PAVILION</text>
    <text x="700" y="342" font-size="10" text-anchor="middle" fill="#5a544a">5 cells · 5h · wall 2h</text>
    <text x="700" y="356" font-size="10" text-anchor="middle" fill="#7a5c2e">signal: tall wall + finial + pennant</text>
  </g>

  <!-- 5 GER : 4 cells (144), wall 2h, dome to 3h, pipe -->
  <g>
    <rect x="818" y="264" width="144" height="36" fill="#e2ddd0" stroke="#4a453d" stroke-width="1.5"/>
    <path d="M818,264 Q890,238 962,264 Z" fill="#e2ddd0" stroke="#4a453d" stroke-width="1.5"/>
    <!-- hem band = PAINT -->
    <rect x="818" y="288" width="144" height="8" fill="#3b6aa3" opacity="0.75"/>
    <!-- rope bands = PAINT -->
    <g stroke="#7a6a52" stroke-width="1.4"><line x1="818" y1="274" x2="962" y2="274"/><line x1="818" y1="282" x2="962" y2="282"/></g>
    <!-- door frame = GEOMETRY -->
    <rect x="876" y="270" width="28" height="30" fill="#6b4f2e" stroke="#3b352d" stroke-width="1.2"/>
    <!-- stove pipe : signal -->
    <rect x="896" y="222" width="7" height="26" fill="#3b352d"/>
    <text x="890" y="326" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#23201b">GER / YURT  (DRUM)</text>
    <text x="890" y="342" font-size="10" text-anchor="middle" fill="#5a544a">4 cells · 3h (2h wall)</text>
    <text x="890" y="356" font-size="10" text-anchor="middle" fill="#7a5c2e">signal: wall/roof break + pipe</text>
  </g>

  <!-- ============ ROW B : SPAN + DOME ============ -->
  <text x="30" y="416" font-size="13" font-weight="bold" fill="#7a5c2e">GENUS: SPAN  (cloth stretched between poles)  ·  and DOME</text>

  <g stroke="#c9c1b2" stroke-width="1">
    <line x1="34" y1="620" x2="1030" y2="620" stroke="#8b8375" stroke-width="1.5"/>
    <line x1="34" y1="602" x2="1030" y2="602" stroke-dasharray="3 6"/>
    <line x1="34" y1="584" x2="1030" y2="584" stroke-dasharray="3 6"/>
    <line x1="34" y1="566" x2="1030" y2="566" stroke-dasharray="3 6"/>
    <line x1="34" y1="548" x2="1030" y2="548" stroke-dasharray="3 6"/>
  </g>
  <g font-size="9.5" fill="#8b8375">
    <text x="12" y="605">1h</text><text x="12" y="569">3h</text><text x="12" y="551">4h</text>
  </g>

  <!-- 6 BEDOUIN BLACK TENT : 5 cells (180), 2.5h, scalloped, open front -->
  <g>
    <path d="M60,620 L60,575 Q82,563 105,575 Q127,563 150,575 Q172,563 195,575 Q217,563 240,575 L240,620 Z"
          fill="#2f2b28" stroke="#17150f" stroke-width="1.4"/>
    <!-- open front : the front hem lifts, showing the void -->
    <path d="M60,620 L60,600 L240,600 L240,620 Z" fill="#f6f3ec"/>
    <path d="M60,600 L240,600" stroke="#17150f" stroke-width="1.2"/>
    <!-- woven stripe = PAINT -->
    <g stroke="#d9d2c2" stroke-width="2.2" opacity="0.8">
      <line x1="62" y1="586" x2="238" y2="586"/><line x1="62" y1="592" x2="238" y2="592"/>
    </g>
    <!-- pole line = geometry -->
    <g stroke="#6b5a3e" stroke-width="2.2">
      <line x1="60" y1="575" x2="60" y2="620"/><line x1="105" y1="575" x2="105" y2="600"/>
      <line x1="150" y1="575" x2="150" y2="600"/><line x1="195" y1="575" x2="195" y2="600"/>
      <line x1="240" y1="575" x2="240" y2="620"/>
    </g>
    <text x="150" y="648" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#23201b">BEDOUIN BLACK TENT</text>
    <text x="150" y="664" font-size="10" text-anchor="middle" fill="#5a544a">4–10 × 2 cells strip · 2–3h · status = length</text>
    <text x="150" y="678" font-size="10" text-anchor="middle" fill="#7a5c2e">signal: scalloped low ridge + open front</text>
  </g>

  <!-- 7 WEDGE / PAPILIO : 2 cells (72), 2h = 36 -->
  <g>
    <polygon points="364,620 436,620 400,584" fill="#8a7a63" stroke="#4a453d" stroke-width="1.5"/>
    <polygon points="436,620 400,584 436,566 472,602" fill="#a1917a" stroke="#4a453d" stroke-width="1.5"/>
    <line x1="400" y1="584" x2="436" y2="566" stroke="#3b352d" stroke-width="2"/>
    <polygon points="392,620 400,596 408,620" fill="#3b352d" opacity="0.7"/>
    <text x="415" y="648" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#23201b">WEDGE / ROMAN PAPILIO</text>
    <text x="415" y="664" font-size="10" text-anchor="middle" fill="#5a544a">exactly 2 × 2 cells · 2h · 8 men</text>
    <text x="415" y="678" font-size="10" text-anchor="middle" fill="#7a5c2e">signal: straight ridge + flat gable ends</text>
  </g>

  <!-- 8 MARQUEE : 4 cells (144), walls 2h, roof 4h -->
  <g>
    <rect x="588" y="584" width="144" height="36" fill="#e6e1d4" stroke="#4a453d" stroke-width="1.5"/>
    <polygon points="580,584 740,584 700,548 620,548" fill="#eeeae0" stroke="#4a453d" stroke-width="1.5"/>
    <!-- awning extension = real overhead cover -->
    <polygon points="740,584 786,584 756,566 700,566" fill="#eeeae0" opacity="0.65" stroke="#4a453d" stroke-width="1.1"/>
    <line x1="786" y1="584" x2="786" y2="620" stroke="#6b5a3e" stroke-width="2.2"/>
    <rect x="642" y="592" width="26" height="28" fill="#3b352d" opacity="0.7"/>
    <text x="676" y="648" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#23201b">MARQUEE (ridge)</text>
    <text x="676" y="664" font-size="10" text-anchor="middle" fill="#5a544a">4 × 8 cells · 4h · officer/command</text>
    <text x="676" y="678" font-size="10" text-anchor="middle" fill="#7a5c2e">signal: broad flat roof + awning</text>
  </g>

  <!-- 9 WICKIUP : 2 cells (72), 2.5h = 45 -->
  <g>
    <path d="M864,620 Q864,575 900,575 Q936,575 936,620 Z" fill="#7e7050" stroke="#4a453d" stroke-width="1.5"/>
    <g stroke="#5d5237" stroke-width="1" opacity="0.8">
      <path d="M872,620 Q876,586 900,578"/><path d="M886,620 Q886,584 900,577"/>
      <path d="M914,620 Q914,584 900,577"/><path d="M928,620 Q924,586 900,578"/>
    </g>
    <path d="M890,620 L890,600 Q900,590 910,600 L910,620 Z" fill="#231f18"/>
    <text x="900" y="648" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#23201b">WICKIUP / BENDER (DOME)</text>
    <text x="900" y="664" font-size="10" text-anchor="middle" fill="#5a544a">2 cells · 2–3h · expedient, no hierarchy</text>
    <text x="900" y="678" font-size="10" text-anchor="middle" fill="#7a5c2e">signal: door arch in a shaggy dome</text>
  </g>

  <!-- footer note -->
  <text x="30" y="392" font-size="10.5" fill="#5a544a">Everything drawn in outline is a candidate for GEOMETRY. Everything drawn as a stripe, band, gore or motif is PAINT (STRUCTURE-KIT-CATALOG §5). Nothing here is ruled.</text>
</svg>
