<path d="M 0 486 Q 360 470 720 484" fill="none" stroke="#D3D1C7" stroke-width="26"/>
<path d="M 0 486 Q 360 470 720 484" fill="none" stroke="#888780" stroke-width="1" stroke-dasharray="6 5"/>
<rect x="192" y="466" width="8" height="12" fill="#7A5A2E"/>
<text x="120" y="510" font-size="10" fill="#6B675E">wayside shrine — where you leave the valley road</text>
<text x="560" y="510" font-size="10" fill="#6B675E">HIGH ground is to the right</text>
</svg>
