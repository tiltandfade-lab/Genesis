<script type="module">
import * as THREE from "/vendor/three/three.module.js";
import {GLTFLoader} from "/vendor/three/addons/loaders/GLTFLoader.js";
const renderer=new THREE.WebGLRenderer({canvas:document.querySelector('#stage'),antialias:true,preserveDrawingBuffer:true});
renderer.setSize(400,264,false);renderer.setPixelRatio(1);renderer.outputColorSpace=THREE.SRGBColorSpace;
const loader=new GLTFLoader();
const load=url=>new Promise((resolve,reject)=>loader.load(url,resolve,undefined,reject));
function viewFor(gltf){
 const scene=new THREE.Scene();scene.background=new THREE.Color(0x242128);scene.add(new THREE.HemisphereLight(0xffedcf,0x303b52,1.8));
 const key=new THREE.DirectionalLight(0xffdfba,3);key.position.set(3,5,4);scene.add(key);

 const group=gltf.scene;const box=new THREE.Box3().setFromObject(group),center=box.getCenter(new THREE.Vector3()),size=box.getSize(new THREE.Vector3());
 group.position.sub(center);group.position.y+=size.y/2;group.rotation.y=-.48;scene.add(group);
 const floor=new THREE.Mesh(new THREE.PlaneGeometry(3,3),new THREE.MeshStandardMaterial({color:0x3b3740,roughness:1}));floor.rotation.x=-Math.PI/2;scene.add(floor);
