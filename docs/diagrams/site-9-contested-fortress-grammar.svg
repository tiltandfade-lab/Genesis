  <!-- PANEL B notes -->
  <g font-size="11.5" fill="#3a3f48">
    <text x="760" y="562" font-size="12.5" font-weight="700" fill="#b5442e">The walk is the gap between two skins, standing on the core.</text>
    <text x="760" y="580">A run too thin to carry its walk is a countable rejection — not a</text>
    <text x="760" y="596">detail. This is why wall <tspan font-style="italic">thickness</tspan> is a first-class runtime fact.</text>
    <text x="760" y="620" font-weight="700">Two cover states from one section:</text>
    <text x="760" y="636">behind the parapet = full cover · up on the banquette,</text>
    <text x="760" y="652">shooting over = ¾ cover (the live <tspan font-family="Menlo, Consolas, monospace" font-size="10.5">urban-scene-frame</tspan> 206 number).</text>
  </g>

