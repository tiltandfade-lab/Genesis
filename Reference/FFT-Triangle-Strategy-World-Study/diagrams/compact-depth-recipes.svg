<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 860" font-family="Helvetica, Arial, sans-serif">
  <rect width="1180" height="860" fill="#14141a"/>
  <text x="24" y="34" fill="#f0f0f0" font-size="22" font-weight="bold">Six compact-vignette depth recipes — relational, never copied layouts</text>
  <text x="24" y="55" fill="#9a9aa8" font-size="13">Each board ≈ 10×14…16×18 cells. Depth comes from stacked bands, short vertical routes, honest frontiers, and context bands — not acreage.</text>

  <defs>
    <marker id="a2" markerWidth="9" markerHeight="7" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#ff6a3c"/></marker>
    <marker id="a3" markerWidth="9" markerHeight="7" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#4cc8ff"/></marker>
  </defs>

  <!-- legend -->
  <g font-size="12" fill="#c8c8d4">
    <rect x="760" y="20" width="16" height="12" fill="#3c4c68"/><text x="782" y="30">low band (arrival)</text>
    <rect x="760" y="38" width="16" height="12" fill="#4c6c54"/><text x="782" y="48">mid band</text>
    <rect x="760" y="56" width="16" height="12" fill="#8a7448"/><text x="782" y="66">high band / deck</text>
    <rect x="900" y="20" width="16" height="12" fill="#2a2a34" stroke="#666"/><text x="922" y="30">scenery-only mass</text>
    <line x1="900" y1="44" x2="916" y2="44" stroke="#ff6a3c" stroke-width="3" marker-end="url(#a2)"/><text x="922" y="48">primary route</text>
    <line x1="900" y1="62" x2="916" y2="62" stroke="#4cc8ff" stroke-width="3" marker-end="url(#a3)"/><text x="922" y="66">service / hidden route</text>
    <rect x="1050" y="20" width="16" height="12" fill="none" stroke="#e8d060" stroke-dasharray="4 3"/><text x="1072" y="30">clipped honest frontier</text>
    <rect x="1050" y="38" width="16" height="12" fill="#26303e"/><text x="1072" y="48">context apron/far band</text>
    <circle cx="1058" cy="62" r="6" fill="#e04040"/><text x="1072" y="66">arrival + first decision</text>
  </g>

  <!-- R1 riser-and-overlook -->
  <g transform="translate(24,90)">
    <text x="0" y="16" fill="#f0d890" font-size="15" font-weight="bold">R1 · SHOULDER OVERLOOK (FFT: Grog Hill class)</text>
    <rect x="0" y="26" width="360" height="200" fill="#26303e"/>
    <rect x="20" y="46" width="320" height="160" fill="#3c4c68"/>
    <polygon points="20,46 200,46 160,120 20,150" fill="#4c6c54"/>
    <polygon points="20,46 120,46 90,90 20,100" fill="#8a7448"/>
    <rect x="240" y="60" width="60" height="46" fill="#2a2a34" stroke="#555"/>
    <circle cx="80" cy="190" r="7" fill="#e04040"/>
    <path d="M 80 190 C 110 160 150 130 190 120 S 280 110 320 90" stroke="#ff6a3c" stroke-width="4" fill="none" marker-end="url(#a2)"/>
    <path d="M 80 190 C 60 150 50 120 60 92" stroke="#4cc8ff" stroke-width="3" fill="none" marker-end="url(#a3)"/>
    <rect x="318" y="70" width="24" height="30" fill="none" stroke="#e8d060" stroke-dasharray="4 3"/>
    <text x="0" y="250" fill="#a8a8b8" font-size="11">arrive low ON the route · decision at cell 2 (climb or pass) · crown deck 2 bands up via short stair · road exits clipped</text>
  </g>

  <!-- R2 threshold-and-undercroft -->
  <g transform="translate(420,90)">
    <text x="0" y="16" fill="#f0d890" font-size="15" font-weight="bold">R2 · THRESHOLD + UNDERCROFT (gate/market class)</text>
    <rect x="0" y="26" width="360" height="200" fill="#26303e"/>
    <rect x="20" y="46" width="320" height="160" fill="#4c6c54"/>
    <rect x="20" y="86" width="320" height="34" fill="#8a7448"/>
    <rect x="150" y="80" width="70" height="46" fill="#2a2a34" stroke="#555"/>
    <rect x="120" y="150" width="120" height="40" fill="#3c4c68"/>
    <circle cx="60" cy="185" r="7" fill="#e04040"/>
    <path d="M 60 185 L 130 170 L 180 130 L 185 103" stroke="#ff6a3c" stroke-width="4" fill="none" marker-end="url(#a2)"/>
    <path d="M 60 185 L 140 178 L 230 170 L 300 120" stroke="#4cc8ff" stroke-width="3" fill="none" marker-end="url(#a3)"/>
    <rect x="20" y="88" width="18" height="30" fill="none" stroke="#e8d060" stroke-dasharray="4 3"/>
    <rect x="322" y="88" width="18" height="30" fill="none" stroke="#e8d060" stroke-dasharray="4 3"/>
    <text x="0" y="250" fill="#a8a8b8" font-size="11">one gate mass astride the route · sunken service yard below grade (depth DOWN) · wall-walk above · both wall ends clipped honest</text>
  </g>

  <!-- R3 crossing -->
  <g transform="translate(816,90)">
    <text x="0" y="16" fill="#f0d890" font-size="15" font-weight="bold">R3 · CROSSING OVER A DROP (Zirekile class)</text>
    <rect x="0" y="26" width="340" height="200" fill="#26303e"/>
    <polygon points="20,46 150,46 130,206 20,206" fill="#4c6c54"/>
    <polygon points="210,46 320,46 320,206 240,206" fill="#4c6c54"/>
    <polygon points="150,46 210,46 240,206 130,206" fill="#1c2430"/>
    <rect x="140" y="110" width="90" height="26" fill="#8a7448"/>
    <circle cx="55" cy="180" r="7" fill="#e04040"/>
    <path d="M 55 180 L 110 150 L 150 123 L 230 123 L 290 100" stroke="#ff6a3c" stroke-width="4" fill="none" marker-end="url(#a2)"/>
    <path d="M 55 180 L 100 195 L 170 190 L 235 175" stroke="#4cc8ff" stroke-width="3" fill="none" marker-end="url(#a3)"/>
    <text x="150" y="70" fill="#6a7a90" font-size="11">void continues under</text>
    <text x="0" y="250" fill="#a8a8b8" font-size="11">the drop bisects the board · deck is the chokepoint · risky low ford as second route · void reads BELOW the floor (depth without area)</text>
  </g>

  <!-- R4 stacked interior -->
  <g transform="translate(24,370)">
    <text x="0" y="16" fill="#f0d890" font-size="15" font-weight="bold">R4 · CUTAWAY STACK (interior/mine class)</text>
    <rect x="0" y="26" width="360" height="200" fill="#26303e"/>
    <rect x="20" y="46" width="320" height="160" fill="#3c4c68"/>
    <rect x="20" y="46" width="320" height="52" fill="#8a7448"/>
    <rect x="20" y="98" width="200" height="54" fill="#4c6c54"/>
    <rect x="240" y="98" width="100" height="108" fill="#2a2a34" stroke="#555"/>
    <circle cx="60" cy="185" r="7" fill="#e04040"/>
    <path d="M 60 185 L 120 170 L 150 125 L 170 100 L 200 72" stroke="#ff6a3c" stroke-width="4" fill="none" marker-end="url(#a2)"/>
    <path d="M 60 185 L 90 160 L 90 120" stroke="#4cc8ff" stroke-width="3" fill="none" marker-end="url(#a3)"/>
    <rect x="20" y="48" width="18" height="28" fill="none" stroke="#e8d060" stroke-dasharray="4 3"/>
    <text x="0" y="250" fill="#a8a8b8" font-size="11">three floors in one window via camera-side omission · stair+ladder verticals · un-entered wing stays sealed mass · top gallery clipped</text>
  </g>

  <!-- R5 perched edge -->
  <g transform="translate(420,370)">
    <text x="0" y="16" fill="#f0d890" font-size="15" font-weight="bold">R5 · PERCHED EDGE (monastery/lair class)</text>
    <rect x="0" y="26" width="360" height="200" fill="#26303e"/>
    <polygon points="20,206 340,206 340,150 250,120 120,110 20,140" fill="#1c2430"/>
    <rect x="60" y="46" width="240" height="90" fill="#4c6c54"/>
    <rect x="200" y="46" width="100" height="50" fill="#8a7448"/>
    <rect x="80" y="46" width="70" height="40" fill="#2a2a34" stroke="#555"/>
    <circle cx="90" cy="120" r="7" fill="#e04040"/>
    <path d="M 90 120 L 160 110 L 220 95 L 250 70" stroke="#ff6a3c" stroke-width="4" fill="none" marker-end="url(#a2)"/>
    <path d="M 90 120 L 120 135 L 190 128 L 245 100" stroke="#4cc8ff" stroke-width="3" fill="none" marker-end="url(#a3)"/>
    <text x="140" y="180" fill="#6a7a90" font-size="11">support face + world below (context band)</text>
    <text x="0" y="250" fill="#a8a8b8" font-size="11">the site perches on a visible support face · the world continues BELOW the board edge (apron) · far premise behind · tower = scenery mass</text>
  </g>

  <!-- R6 linked windows -->
  <g transform="translate(816,370)">
    <text x="0" y="16" fill="#f0d890" font-size="15" font-weight="bold">R6 · LINKED WINDOWS (large site, no acreage)</text>
    <rect x="0" y="26" width="340" height="200" fill="#26303e"/>
    <rect x="16" y="60" width="130" height="100" fill="#3c4c68" stroke="#8898b8"/>
    <rect x="196" y="46" width="130" height="90" fill="#20262e" stroke="#4a5568" stroke-dasharray="5 4"/>
    <rect x="216" y="146" width="110" height="66" fill="#20262e" stroke="#4a5568" stroke-dasharray="5 4"/>
    <circle cx="40" cy="140" r="7" fill="#e04040"/>
    <path d="M 40 140 L 90 110 L 140 92" stroke="#ff6a3c" stroke-width="4" fill="none" marker-end="url(#a2)"/>
    <rect x="140" y="82" width="14" height="24" fill="none" stroke="#e8d060" stroke-dasharray="4 3"/>
    <path d="M 154 94 L 196 84" stroke="#e8d060" stroke-width="2" stroke-dasharray="5 4" fill="none"/>
    <path d="M 100 160 L 216 172" stroke="#e8d060" stroke-width="2" stroke-dasharray="5 4" fill="none"/>
    <text x="200" y="100" fill="#6a7a90" font-size="11">next window</text>
    <text x="226" y="184" fill="#6a7a90" font-size="11">service window</text>
    <text x="0" y="250" fill="#a8a8b8" font-size="11">"large" = persistent linked identity: one active compact window · 2–3 precommitted frontiers · crossing a frontier materializes the next window</text>
  </g>

  <!-- footer contract -->
  <g transform="translate(24,660)">
    <rect x="0" y="0" width="1132" height="150" fill="#1c1c24" stroke="#3a3a48"/>
    <text x="16" y="26" fill="#e8e8f0" font-size="14" font-weight="bold">Every recipe obeys the same contract</text>
    <text x="16" y="50" fill="#b8b8c8" font-size="12">ARRIVAL LANDING → first decision within 1–3 moves → one short rising route → one lower/hidden service route → one clipped honest continuation</text>
    <text x="16" y="70" fill="#b8b8c8" font-size="12">→ one scenery-only high mass → near-field context + far-field premise (bands, not acreage) → no false exits, no empty approach, no backtrack-through-solved-space</text>
    <text x="16" y="98" fill="#8fd08f" font-size="12">Height substitutes for acreage (H4): 2–3 stacked bands + a drop reads deeper than a flat board twice the size — measured in the cohort (Zirekile 110 cells out-reads Mandalia 156).</text>
    <text x="16" y="122" fill="#e0c060" font-size="12">Movement doctrine honored: journeys render only where the journey itself contains decisions; frontiers replace walking.</text>
  </g>
  <text x="24" y="838" fill="#6a6a78" font-size="11">Original abstract diagrams derived from findings; no traced game maps. Research only.</text>
</svg>
