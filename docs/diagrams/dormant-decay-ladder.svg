<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 700" width="1040" height="700" font-family="Helvetica, Arial, sans-serif">
  <title>Site 3 — the proposed decay ladder and its six orthogonal vectors</title>
  <desc>Six decay rungs D0 to D5 shown as building sections, with six orthogonal vectors that may apply at any rung. PROPOSED, not ruled.</desc>

  <rect x="0" y="0" width="1040" height="700" fill="#f4f1ea"/>

  <text x="32" y="44" font-size="23" font-weight="bold" fill="#23201c">SITE 3 — THE DECAY LADDER (PROPOSED)</text>
  <text x="32" y="68" font-size="14" fill="#6a635a">Rungs are assigned PER ZONE, never per site. At least two distinct rungs are required wherever a site has more than one zone.</text>

  <!-- ground line -->
  <line x1="32" y1="330" x2="1008" y2="330" stroke="#b9b0a2" stroke-width="2"/>

  <!-- ============ D0 HELD ============ -->
  <g>
    <rect x="44" y="232" width="112" height="98" fill="#cfc6b6" stroke="#6a635a" stroke-width="2"/>
    <polygon points="38,232 100,196 162,232" fill="#8d5f45" stroke="#4a3527" stroke-width="2"/>
    <rect x="86" y="278" width="28" height="52" fill="#3b352d" stroke="#4a3527" stroke-width="2"/>
    <circle cx="107" cy="304" r="4" fill="#d8c46a" stroke="#4a3527" stroke-width="1.5"/>
    <rect x="56" y="248" width="20" height="18" fill="#8fa3ab" stroke="#4a3527" stroke-width="1.5"/>
    <rect x="124" y="248" width="20" height="18" fill="#8fa3ab" stroke="#4a3527" stroke-width="1.5"/>
    <text x="100" y="360" font-size="15" font-weight="bold" text-anchor="middle" fill="#23201c">D0 HELD</text>
    <text x="100" y="378" font-size="10.5" text-anchor="middle" fill="#6a635a">locked · dry · inspected</text>
    <text x="100" y="393" font-size="10.5" text-anchor="middle" fill="#6a635a">contents thinned</text>
    <text x="100" y="423" font-size="10.5" text-anchor="middle" fill="#8a5a2b" font-style="italic">nothing spatial changes</text>
    <text x="100" y="438" font-size="10.5" text-anchor="middle" fill="#8a5a2b" font-style="italic">but an OWNER still exists</text>
  </g>

  <!-- ============ D1 LEAKING ============ -->
  <g>
    <rect x="204" y="232" width="112" height="98" fill="#cfc6b6" stroke="#6a635a" stroke-width="2"/>
    <polygon points="198,232 260,196 322,232" fill="#8d5f45" stroke="#4a3527" stroke-width="2"/>
    <polygon points="252,208 268,208 262,232 246,232" fill="#f4f1ea" stroke="#4a3527" stroke-width="1.5"/>
    <line x1="258" y1="232" x2="258" y2="330" stroke="#5d7f8c" stroke-width="3" stroke-dasharray="5 6"/>
    <ellipse cx="258" cy="326" rx="26" ry="6" fill="#5d7f8c" opacity="0.55"/>
    <rect x="246" y="278" width="28" height="52" fill="#3b352d" stroke="#4a3527" stroke-width="2"/>
    <rect x="216" y="248" width="20" height="18" fill="#8fa3ab" stroke="#4a3527" stroke-width="1.5"/>
    <text x="260" y="360" font-size="15" font-weight="bold" text-anchor="middle" fill="#23201c">D1 LEAKING</text>
    <text x="260" y="378" font-size="10.5" text-anchor="middle" fill="#6a635a">one envelope breach</text>
    <text x="260" y="393" font-size="10.5" text-anchor="middle" fill="#6a635a">water has a path</text>
    <text x="260" y="423" font-size="10.5" text-anchor="middle" fill="#8a5a2b" font-style="italic">soft floor · new sight line</text>
    <text x="260" y="438" font-size="10.5" text-anchor="middle" fill="#8a5a2b" font-style="italic">fully reversible</text>
  </g>

  <!-- ============ D2 UNROOFED ============ -->
  <g>
    <path d="M364 330 L364 236 L372 228 L382 238 L392 226 L404 236 L416 224 L428 234 L440 226 L452 236 L462 228 L470 236 L470 330 Z" fill="#cfc6b6" stroke="#6a635a" stroke-width="2"/>
    <rect x="404" y="278" width="28" height="52" fill="#3b352d" stroke="#4a3527" stroke-width="2"/>
    <rect x="376" y="250" width="20" height="20" fill="#dfe6ea" stroke="#4a3527" stroke-width="1.5"/>
    <rect x="440" y="250" width="20" height="20" fill="#dfe6ea" stroke="#4a3527" stroke-width="1.5"/>
    <path d="M356 330 q10 -8 22 -4 q14 5 26 0 q16 -6 30 2 q14 6 28 -2 q14 -7 24 4 Z" fill="#a89b86" stroke="#6a635a" stroke-width="1.5"/>
    <g stroke="#c9a227" stroke-width="2.5" opacity="0.9">
      <line x1="392" y1="180" x2="392" y2="222"/>
      <line x1="418" y1="176" x2="418" y2="218"/>
      <line x1="444" y1="180" x2="444" y2="220"/>
    </g>
    <text x="417" y="360" font-size="15" font-weight="bold" text-anchor="middle" fill="#23201c">D2 UNROOFED</text>
    <text x="417" y="378" font-size="10.5" text-anchor="middle" fill="#6a635a">cover gone over ≥1 bay</text>
    <text x="417" y="393" font-size="10.5" text-anchor="middle" fill="#6a635a">walls stand · voids remain</text>
    <text x="417" y="423" font-size="10.5" text-anchor="middle" fill="#8a5a2b" font-style="italic">SKY owns the light</text>
    <text x="417" y="438" font-size="10.5" text-anchor="middle" fill="#8a5a2b" font-style="italic">weather + plunging fire</text>
  </g>

  <!-- ============ D3 PARTIAL COLLAPSE ============ -->
  <g>
    <path d="M556 330 L556 240 L566 232 L578 242 L590 230 L600 240 L600 268 L612 262 L622 276 L636 268 L648 282 L660 292 L660 330 Z" fill="#cfc6b6" stroke="#6a635a" stroke-width="2"/>
    <rect x="566" y="252" width="20" height="20" fill="#dfe6ea" stroke="#4a3527" stroke-width="1.5"/>
    <!-- rubble cone as ramp -->
    <path d="M600 330 L660 330 L660 292 Z" fill="#a89b86" stroke="#6a635a" stroke-width="2"/>
    <path d="M604 330 L648 330 L648 300" fill="none" stroke="#8b8272" stroke-width="1.2"/>
    <path d="M610 330 L640 330 L640 310" fill="none" stroke="#8b8272" stroke-width="1.2"/>
    <!-- breach arrow -->
    <path d="M676 318 L666 302 L672 302 L672 288 L680 288 L680 302 L686 302 Z" fill="#8a5a2b"/>
    <text x="694" y="300" font-size="10.5" fill="#8a5a2b">route</text>
    <g stroke="#c9a227" stroke-width="2.5" opacity="0.9">
      <line x1="632" y1="200" x2="644" y2="262"/>
      <line x1="654" y1="204" x2="662" y2="278"/>
    </g>
    <text x="612" y="360" font-size="15" font-weight="bold" text-anchor="middle" fill="#23201c">D3 PARTIAL COLLAPSE</text>
    <text x="612" y="378" font-size="10.5" text-anchor="middle" fill="#6a635a">a wall or vault fails</text>
    <text x="612" y="393" font-size="10.5" text-anchor="middle" fill="#6a635a">it rests at angle of repose</text>
    <text x="612" y="423" font-size="10.5" text-anchor="middle" fill="#8a5a2b" font-style="italic">the cone IS a ramp —</text>
    <text x="612" y="438" font-size="10.5" text-anchor="middle" fill="#8a5a2b" font-style="italic">it reaches the breach</text>
  </g>

  <!-- ============ D4 REDUCED ============ -->
  <g>
    <path d="M756 330 L756 306 L768 300 L780 308 L792 302 L804 310 L816 302 L828 308 L840 300 L852 308 L852 330 Z" fill="#cfc6b6" stroke="#6a635a" stroke-width="2"/>
    <!-- scrub following the wall line -->
    <g fill="#6f8f52" stroke="#3f5a2e" stroke-width="1.2">
      <circle cx="762" cy="298" r="9"/>
      <circle cx="800" cy="294" r="11"/>
      <circle cx="842" cy="297" r="9"/>
    </g>
    <!-- standee for scale -->
    <g stroke="#23201c" stroke-width="2" fill="none">
      <circle cx="806" cy="286" r="5" fill="#23201c"/>
      <line x1="806" y1="291" x2="806" y2="316"/>
      <line x1="806" y1="316" x2="799" y2="330"/>
      <line x1="806" y1="316" x2="813" y2="330"/>
      <line x1="796" y1="300" x2="816" y2="300"/>
    </g>
    <text x="804" y="360" font-size="15" font-weight="bold" text-anchor="middle" fill="#23201c">D4 REDUCED</text>
    <text x="804" y="378" font-size="10.5" text-anchor="middle" fill="#6a635a">walls below ~1 m</text>
    <text x="804" y="393" font-size="10.5" text-anchor="middle" fill="#6a635a">scrub follows the plan</text>
    <text x="804" y="423" font-size="10.5" text-anchor="middle" fill="#8a5a2b" font-style="italic">COVER-CLASS BOUNDARY:</text>
    <text x="804" y="438" font-size="10.5" text-anchor="middle" fill="#8a5a2b" font-style="italic">interior → exterior;</text>
    <text x="804" y="453" font-size="10.5" text-anchor="middle" fill="#8a5a2b" font-style="italic">wall = half cover</text>
  </g>

  <!-- ============ D5 EARTHWORK ============ -->
  <g>
    <path d="M900 330 q22 -22 46 -10 q18 9 34 -6 q14 -13 28 4 L1008 330 Z" fill="#7f8f5c" stroke="#57633c" stroke-width="2"/>
    <path d="M918 330 q14 -14 30 -8" fill="none" stroke="#e9eef2" stroke-width="4" opacity="0.85"/>
    <path d="M966 330 q12 -13 26 -3" fill="none" stroke="#e9eef2" stroke-width="4" opacity="0.85"/>
    <text x="954" y="360" font-size="15" font-weight="bold" text-anchor="middle" fill="#23201c">D5 EARTHWORK</text>
    <text x="954" y="378" font-size="10.5" text-anchor="middle" fill="#6a635a">no fabric — banks,</text>
    <text x="954" y="393" font-size="10.5" text-anchor="middle" fill="#6a635a">hollow-ways, pits</text>
    <text x="954" y="423" font-size="10.5" text-anchor="middle" fill="#8a5a2b" font-style="italic">the plan is a</text>
    <text x="954" y="438" font-size="10.5" text-anchor="middle" fill="#8a5a2b" font-style="italic">HEIGHT FIELD, drawn by</text>
    <text x="954" y="453" font-size="10.5" text-anchor="middle" fill="#8a5a2b" font-style="italic">deposit in the low ground</text>
  </g>

  <!-- arrow along the ladder -->
  <g>
    <line x1="44" y1="160" x2="988" y2="160" stroke="#b9b0a2" stroke-width="2"/>
    <polygon points="988,160 976,154 976,166" fill="#b9b0a2"/>
    <text x="44" y="150" font-size="12" fill="#6a635a">maintenance withdrawn · elapsed time · reclaimers</text>
  </g>

  <!-- ============ VECTOR BAND ============ -->
  <rect x="32" y="466" width="976" height="132" rx="8" fill="#e8e2d6" stroke="#b9b0a2" stroke-width="1.5"/>
  <text x="52" y="494" font-size="16" font-weight="bold" fill="#23201c">SIX ORTHOGONAL VECTORS — legal at ANY rung, not steps on the ladder</text>

  <g font-size="12">
    <g>
      <rect x="52" y="508" width="146" height="72" rx="5" fill="#f4f1ea" stroke="#8a5a2b" stroke-width="1.5"/>
      <text x="125" y="528" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#8a5a2b">ROBBED</text>
      <text x="125" y="546" font-size="10.8" text-anchor="middle" fill="#4a4438">people take dressed stone,</text>
      <text x="125" y="560" font-size="10.8" text-anchor="middle" fill="#4a4438">lintels, metal, timber —</text>
      <text x="125" y="574" font-size="10.8" text-anchor="middle" fill="#4a4438">INVERTS what survives</text>
    </g>
    <g>
      <rect x="210" y="508" width="146" height="72" rx="5" fill="#f4f1ea" stroke="#3f6b7d" stroke-width="1.5"/>
      <text x="283" y="528" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#3f6b7d">FLOODED</text>
      <text x="283" y="546" font-size="10.8" text-anchor="middle" fill="#4a4438">one dead-level datum sorts</text>
      <text x="283" y="560" font-size="10.8" text-anchor="middle" fill="#4a4438">the site by height —</text>
      <text x="283" y="574" font-size="10.8" text-anchor="middle" fill="#4a4438">below it, PRESERVED</text>
    </g>
    <g>
      <rect x="368" y="508" width="146" height="72" rx="5" fill="#f4f1ea" stroke="#7a6a3c" stroke-width="1.5"/>
      <text x="441" y="528" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#7a6a3c">BURIED</text>
      <text x="441" y="546" font-size="10.8" text-anchor="middle" fill="#4a4438">silt, spoil, sand, ash, snow</text>
      <text x="441" y="560" font-size="10.8" text-anchor="middle" fill="#4a4438">fill from below or above —</text>
      <text x="441" y="574" font-size="10.8" text-anchor="middle" fill="#4a4438">headroom lost, contents kept</text>
    </g>
    <g>
      <rect x="526" y="508" width="146" height="72" rx="5" fill="#f4f1ea" stroke="#4f7238" stroke-width="1.5"/>
      <text x="599" y="528" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#4f7238">OVERGROWN</text>
      <text x="599" y="546" font-size="10.8" text-anchor="middle" fill="#4a4438">a timed succession:</text>
      <text x="599" y="560" font-size="10.8" text-anchor="middle" fill="#4a4438">ledges → joints → floor →</text>
      <text x="599" y="574" font-size="10.8" text-anchor="middle" fill="#4a4438">canopy. Inherits the plan</text>
    </g>
    <g>
      <rect x="684" y="508" width="146" height="72" rx="5" fill="#f4f1ea" stroke="#6b3f6b" stroke-width="1.5"/>
      <text x="757" y="528" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#6b3f6b">SEALED</text>
      <text x="757" y="546" font-size="10.8" text-anchor="middle" fill="#4a4438">blocked in a CHEAPER, LATER</text>
      <text x="757" y="560" font-size="10.8" text-anchor="middle" fill="#4a4438">material than it fills —</text>
      <text x="757" y="574" font-size="10.8" text-anchor="middle" fill="#4a4438">preserves; inverts the problem</text>
    </g>
    <g>
      <rect x="842" y="508" width="146" height="72" rx="5" fill="#f4f1ea" stroke="#8c4a34" stroke-width="1.5"/>
      <text x="915" y="528" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#8c4a34">TRANSIENT-</text>
      <text x="915" y="542" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#8c4a34">OCCUPIED</text>
      <text x="915" y="560" font-size="10.8" text-anchor="middle" fill="#4a4438">dens, roosts, scavengers,</text>
      <text x="915" y="574" font-size="10.8" text-anchor="middle" fill="#4a4438">robbing crews — never stable</text>
    </g>
  </g>

  <text x="32" y="632" font-size="12.5" fill="#6a635a"><tspan font-weight="bold">A stable operating population ends the transform</tspan> — it becomes Site 8 (two persistent claims with a control difference) or the host's own number.</text>
  <text x="32" y="654" font-size="12.5" fill="#6a635a"><tspan font-weight="bold">Cut voids survive; built volumes fall.</tspan> The below-grade half is the reliable playable volume; the above-ground half is the silhouette.</text>
  <text x="32" y="676" font-size="11" fill="#8d857a">STATUS: DRAFT — PENDING CODEX ADVERSARIAL REVIEW (2026-07-27 campaign). Every rung, vector and law here is PROPOSED, never ruled.</text>
  <text x="32" y="691" font-size="11" fill="#8d857a">Source: Reference/Dormant-Abandoned-Study-0727/ · consumer: docs/SITE-3-DORMANT-CONCEPT.md</text>
</svg>
