/* ---- the engine's exact PS1 tunables (theater-boot.js) ----
   DEV-SHEET-ONLY OVERRIDE (chore/grit-compare, comparison-only — never touches theater-boot.js):
   ?res=<fraction> lets the director's-gate compare alternate internal-res scales (e.g. 1/2.5, 1/2)
   against the engine's real default. Param ABSENT -> PSX_RES_SCALE stays the literal 1/3 the
   engine ships (Adam HELD the 0.4 ruling 2026-07-04 pending the zoom gate), so this rig stays
   byte-faithful to src/ui/theater-boot.js's PSX pass when unqueried. */
const PSX_DITHER_AMPLITUDE = 48.0, PSX_VERTEX_SNAP_GRID = 96;
const _resParam = parseFloat(new URLSearchParams(location.search).get('res'));
const PSX_RES_SCALE = (Number.isFinite(_resParam) && _resParam > 0 && _resParam <= 1) ? _resParam : 1/3;
const VOID_BG = 0x0a0908;
const DITHER_GLSL = `
  #ifdef PSX_DITHER
  {
    const float bayer4x4[16] = float[16](
      0.0,  8.0,  2.0, 10.0, 12.0, 4.0, 14.0,  6.0,
      3.0, 11.0,  1.0,  9.0, 15.0, 7.0, 13.0,  5.0);
    int dx = int(mod(gl_FragCoord.x, 4.0));
    int dy = int(mod(gl_FragCoord.y, 4.0));
    float threshold = (bayer4x4[dy * 4 + dx] / 16.0 - 0.5) * (1.0 / ${PSX_DITHER_AMPLITUDE.toFixed(1)});
    outgoingLight += threshold;
  }
  #endif`;
const VERTEX_SNAP_GLSL = `
  #ifdef PSX_VERTEX_SNAP
  {
    float snapGrid = ${PSX_VERTEX_SNAP_GRID.toFixed(1)};
    vec4 snapped = gl_Position;
    snapped.xy = round((snapped.xy / snapped.w) * snapGrid) / snapGrid * snapped.w;
    gl_Position = snapped;
  }
  #endif`;
function applyPsxShaderTweaks(material){
  material.onBeforeCompile = (shader) => {
    shader.fragmentShader = "#define PSX_DITHER\n" + shader.fragmentShader.replace(
      "#include <opaque_fragment>", DITHER_GLSL + "\n  #include <opaque_fragment>");
    shader.vertexShader = "#define PSX_VERTEX_SNAP\n" + shader.vertexShader.replace(
      "#include <project_vertex>", "#include <project_vertex>\n  " + VERTEX_SNAP_GLSL);
  };
  return material;
}

/* ---- the roster (whatever exists; grid scales to 12+) ---- */
const ROSTER = setDefs.filter(r => !r.missing);

const COLS = 4, CELL = 340, CH = 430;
const rows = Math.ceil(ROSTER.length / COLS);
const cssW = COLS*CELL, cssH = rows*CH;
const canvas = document.getElementById('sheet');
canvas.style.width = cssW+'px'; canvas.style.height = cssH+'px';

const renderer = new THREE.WebGLRenderer({canvas, antialias:false, alpha:false, preserveDrawingBuffer:true});
renderer.setClearColor(VOID_BG, 1);
renderer.setSize(Math.round(cssW*PSX_RES_SCALE), Math.round(cssH*PSX_RES_SCALE), false); // 1/3-res buffer
renderer.setScissorTest(true);
const bufW = Math.round(cssW*PSX_RES_SCALE), bufH = Math.round(cssH*PSX_RES_SCALE);

/* ---- TEXEL GRAIN (prototype, ?grain=0 to disable): a seeded generated atlas in the engine's
   pixel-skin idiom (canvas-generated, NearestFilter, no mipmaps, deterministic — no asset files).
   Each quad (tri pair) samples its own small UV window, multiplied UNDER the vertex colors, so the
   authored palette stays and the surface picks up VS texel-dirt. ---- */
const GRAIN = new URLSearchParams(location.search).get('grain') !== '0';
let _grainTex = null;
function grainTexture(){
  if(_grainTex) return _grainTex;
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const g = c.getContext('2d');
  g.fillStyle = '#f2f2f2'; g.fillRect(0,0,128,128);        // near-white base (multiply ≈ subtle)
  let s = 987654321 >>> 0;
  const rnd = () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296);
  for(let i=0;i<170;i++){                                   // broad soft mottle patches (cloth wear)
    const v = (0.86 + rnd()*0.10)*255|0;
    g.fillStyle = `rgb(${v},${v},${v})`;
    g.fillRect((rnd()*128)|0, (rnd()*128)|0, 3 + ((rnd()*4)|0), 3 + ((rnd()*4)|0));
  }
  for(let i=0;i<4200;i++){                                  // mottle: darker flecks + rare pale chips (Adam: crank ~1.5x)
    const dark = rnd() < 0.85;
    const v = dark ? 0.60 + rnd()*0.34 : 1.0;
    const vv = (v*255)|0;
    g.fillStyle = `rgb(${vv},${vv},${vv})`;
    g.fillRect((rnd()*128)|0, (rnd()*128)|0, 1 + ((rnd()*3)|0), 1 + ((rnd()*3)|0));
  }
  for(let i=0;i<110;i++){                                   // worn scratches, a touch deeper
    const x=(rnd()*128)|0, y=(rnd()*128)|0, len=2+(rnd()*6)|0, v=(0.58+rnd()*0.16)*255|0;
    g.fillStyle = `rgb(${v},${v},${v})`;
    g.fillRect(x, y, rnd()<0.5?len:1, rnd()<0.5?1:len);
  }
  _grainTex = new THREE.CanvasTexture(c);
  _grainTex.magFilter = THREE.NearestFilter; _grainTex.minFilter = THREE.NearestFilter;
  _grainTex.generateMipmaps = false;
  return _grainTex;
}
function quadUVs(triCount){
  const uv = new Float32Array(triCount*3*2);
  const CELLS = 14, W = 2/16;                               // 14x14 usable windows in the 128px atlas
  let h = 2463534242 >>> 0;
  const hash = () => ((h = (h ^ (h<<13)) >>> 0, h = (h ^ (h>>>17)) >>> 0, h = (h ^ (h<<5)) >>> 0) / 4294967296);
  for(let t=0;t<triCount;t++){
    if(t%2===0){ var cu = (hash()*CELLS|0)/16, cv = (hash()*CELLS|0)/16; }  // same window for the quad's tri pair
    const o = t*6;
    uv[o]=cu;     uv[o+1]=cv;
    uv[o+2]=cu+W; uv[o+3]=cv;
    uv[o+4]=cu+(t%2?W:0); uv[o+5]=cv+W;
  }
  return uv;
}

/* ---- SPECULAR on metal/glass (Adam 2026-07-03): per-region gloss via geometry GROUPS —
   matte Lambert / metal Phong / glass Phong. Engine precedent: theater-boot U5 glossy figures
   are MeshPhongMaterial and the PSX injections apply in Phong too. Until P1′ authored channel
   tags exist, regions are classified by the same "coarse color read" idiom the engine's
   pixel-skin uses: cool-desaturated mids = steel, warm gold = brass, bright cyan = glass. ---- */
const SPEC = new URLSearchParams(location.search).get('spec') !== '0';
function matBucket(r, g, b){
  const v = Math.max(r,g,b), sat = v - Math.min(r,g,b);
  if(b > r && b > g && v > 0.55) return 2;                       // glass (orb cyans)
  if(r > g*1.12 && g > b*1.45 && v > 0.35 && sat > 0.15) return 1; // brass/gold -> metal
  if(sat < 0.09 && v > 0.40 && v < 0.74 && b >= r) return 1;     // steel (cool desaturated mids)
  return 0;                                                       // matte
}
function figureScene(fn, yawDeg = 45){
  resetGeom(); fn();
  const {POS, COL} = getBuffers();
  const triCount = POS.length/9;
  const uvAll = quadUVs(triCount);
  /* bucket tris, then rebuild in bucket-contiguous order so addGroup ranges work */
  const buckets = [[],[],[]];
  for(let t=0;t<triCount;t++){
    const r=(COL[t*9]+COL[t*9+3]+COL[t*9+6])/3, g=(COL[t*9+1]+COL[t*9+4]+COL[t*9+7])/3, b=(COL[t*9+2]+COL[t*9+5]+COL[t*9+8])/3;
    buckets[SPEC ? matBucket(r,g,b) : 0].push(t);
  }
  const pos=new Float32Array(POS.length), col=new Float32Array(COL.length), uv=new Float32Array(triCount*6);
  let w=0;
  const ranges=[];
  for(const bkt of buckets){
    const start=w;
    for(const t of bkt){
      pos.set(POS.slice(t*9,t*9+9), w*9); col.set(COL.slice(t*9,t*9+9), w*9);
      uv.set(uvAll.slice(t*6,t*6+6), w*6); w++;
    }
    ranges.push([start*3, (w-start)*3]);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setAttribute('color',    new THREE.Float32BufferAttribute(col, 3));
  if(GRAIN) geo.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  ranges.forEach(([s,c],i)=>{ if(c>0) geo.addGroup(s,c,i); });
  geo.computeVertexNormals(); geo.computeBoundingBox();
  const bb = geo.boundingBox, ctr = bb.getCenter(new THREE.Vector3()), sz = bb.getSize(new THREE.Vector3());
  const reach = Math.max(sz.x, sz.y, sz.z) * 0.5;
  const scene = new THREE.Scene(); scene.background = new THREE.Color(VOID_BG);
  const base = {vertexColors:true, flatShading:true};
  if(GRAIN) base.map = grainTexture();
  const mats = [
    applyPsxShaderTweaks(new THREE.MeshLambertMaterial({...base})),                                              // matte
    applyPsxShaderTweaks(new THREE.MeshPhongMaterial({...base, shininess:46, specular:0x8a8f94})),               // metal
    applyPsxShaderTweaks(new THREE.MeshPhongMaterial({...base, shininess:95, specular:0xbfdbe8})),               // glass
  ];
  scene.add(new THREE.Mesh(geo, mats));
  // engine lights: key 0.72 white @ (5,9,7), fill 0.22 anti-key, + low ambient so shadowed albedo reads
  const key = new THREE.DirectionalLight(0xffffff, 0.72); key.position.set(5,9,7); scene.add(key);
  const fill = new THREE.DirectionalLight(0xffffff, 0.22); fill.position.set(-5,4,-6); scene.add(fill);
  scene.add(new THREE.AmbientLight(0xffffff, 0.32));
  // a single desaturated FFT tile under the figure (board-piece read)
  const tileMat = applyPsxShaderTweaks(new THREE.MeshLambertMaterial({color:0x2a241d}));
  const tile = new THREE.Mesh(new THREE.PlaneGeometry(reach*2.1, reach*2.1), tileMat);
  tile.rotation.x = -Math.PI/2; tile.position.set(0, bb.min.y-0.002, 0); scene.add(tile);
  // dimetric ortho camera (engine FFT feel: ~45 yaw / ~30 elev)
  const yaw=yawDeg*Math.PI/180, el=30*Math.PI/180, d=30, cy=ctr.y;
  const cam = new THREE.OrthographicCamera(-1,1,1,-1,0.1,120);
  cam.position.set(Math.sin(yaw)*Math.cos(el)*d, Math.sin(el)*d+cy, Math.cos(yaw)*Math.cos(el)*d);
  cam.lookAt(0, cy*0.92, 0);
  return {scene, cam, reach, cy};
}

const cells = ROSTER.map(r => ({...r, ...figureScene(r.build, r.yawDeg)}));
const grid = document.getElementById('grid');
function draw(){
  for(let i=0;i<cells.length;i++){
    const c = cells[i];
    const col = i%COLS, row = (i/COLS)|0;
    // scissor rect in the LOW-RES buffer (y flipped: gl origin bottom-left)
    const px = Math.round(col*CELL*PSX_RES_SCALE), pw = Math.round(CELL*PSX_RES_SCALE);
    const ph = Math.round(CH*PSX_RES_SCALE);
    const py = bufH - Math.round((row+1)*CH*PSX_RES_SCALE);
    const asp = CELL/CH, hh = c.reach*1.45;
    c.cam.left=-hh*asp; c.cam.right=hh*asp; c.cam.top=hh; c.cam.bottom=-hh; c.cam.updateProjectionMatrix();
    renderer.setViewport(px,py,pw,ph); renderer.setScissor(px,py,pw,ph);
    renderer.render(c.scene, c.cam);
    // HTML label overlay (CSS-space)
    const lab = document.createElement('div'); lab.className='lbl';
    lab.style.left=(col*CELL)+'px'; lab.style.top=(row*CH)+'px'; lab.style.width=CELL+'px'; lab.style.height=CH+'px';
    lab.innerHTML = `<div class="lbl" style="position:absolute;bottom:8px">${c.name}${c.sub ? ' &nbsp;<span class="sub">' + c.sub + '</span>' : ''}</div>`;
    grid.appendChild(lab);
  }
}
draw();
document.getElementById('stat').textContent =
  `set:${SET_KEY} · ${cells.length} of ${setDefs.length} · engine-PS1 (dither+vertex-snap+1/3-res) · whole-object figures`;
window.__ready = true;
</script>
</body>
</html>
