<header><h1>Fantasy artifact gallery · B treatment</h1><p>Existing ornate art, each rebuilt as a shallow faceted extrusion with a recessed body and physical rim. This is a direction sample, not runtime admission.</p></header>

import * as THREE from "/vendor/three/three.module.js";import {GLTFLoader} from "/vendor/three/addons/loaders/GLTFLoader.js";
const renderer=new THREE.WebGLRenderer({canvas:document.querySelector('#stage'),antialias:true,preserveDrawingBuffer:true});renderer.setSize(480,286,false);renderer.setPixelRatio(1);renderer.outputColorSpace=THREE.SRGBColorSpace;
const loader=new GLTFLoader(),load=url=>new Promise((resolve,reject)=>loader.load(url,resolve,undefined,reject));
function viewFor(gltf){const scene=new THREE.Scene();scene.background=new THREE.Color(0x232127);scene.add(new THREE.HemisphereLight(0xffedcf,0x26313e,1.1));const key=new THREE.DirectionalLight(0xffd6a6,3.4);key.position.set(-3,5,4);scene.add(key);const rim=new THREE.DirectionalLight(0x7aa9d8,1.25);rim.position.set(4,2,-3);scene.add(rim);const group=gltf.scene,box=new THREE.Box3().setFromObject(group),center=box.getCenter(new THREE.Vector3()),size=box.getSize(new THREE.Vector3());group.position.sub(center);group.position.y+=size.y/2;scene.add(group);const wall=new THREE.Mesh(new THREE.BoxGeometry(2.7,1.9,.12),new THREE.MeshStandardMaterial({color:0x474148,roughness:.95,flatShading:true}));wall.position.set(0,.75,-.20);scene.add(wall);const max=Math.max(size.x,size.y,.01),cam=new THREE.OrthographicCamera(-1,1,.6,-.6,.01,100);cam.position.set(2.5,2,3.8).normalize().multiplyScalar(max*3.2);cam.lookAt(0,size.y*.48,0);cam.zoom=1.06/max;cam.updateProjectionMatrix();return{scene,cam}}
