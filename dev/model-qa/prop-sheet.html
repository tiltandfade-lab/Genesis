<!-- dev/model-qa/prop-sheet.html — the PROP/SCENERY analog of ps1-sheet.html. Renders every
     whole-object PROP (WHOLE_OBJECT_REGISTRY "prop:*" + "light:*" keys, enumerated LIVE from the
     real registry — see the ROSTERS comment), the "blank:" fallbacks, any authored-but-unregistered
     dungeon/env props (none since the 2026-07-08 prop-registration pass wired the 12 gap entries
     into the registry; the section renders only if a new gap appears), and every realm FLOOR
     SURFACE, all through a
     BYTE-FAITHFUL copy of the engine's PS1 render path (src/ui/theater-boot.js T1.5): 4x4 Bayer
     ordered-dither pre <opaque_fragment>, clip-space vertex-snap post <project_vertex>, antialias
     OFF, 1/3-res buffer upscaled with image-rendering:pixelated, void clear, key(0.72)+fill(0.22)
     Lambert. Same tunables ps1-sheet.html carries.

     FLOOR SWATCHES are textured through a byte-faithful copy of theater-boot.js's
     FLOOR_MATERIAL_RECIPES + buildFloorMaterialCanvas (that file is the giant classic-script engine
     boot — it cannot be import()ed standalone, so — exactly as ps1-sheet reproduces the PSX shader
     inline — the recipe is reproduced here and cited to its source lines). The realm-surface DATA is
     the REAL data/realm-surfaces.js (loaded as a classic script + bridged to window, never copied).
     THEATER_ENV_PALETTE (4 envs) is a numeric mirror of src/engine/theater-data.js's env palette (2026-07-08 lifted tops, checker retired).

     Serve the repo root over localhost, then open /dev/model-qa/prop-sheet.html .

     feat/prop-sheet-dims: every geometry cell now carries a REAL-WORLD DIMENSIONS caption
     (W×D×H in staged engine units AND feet — see the FEET_PER_UNIT derivation comment in the
     module), a SCALE AUDIT strip at the top (human meeple vs table/cart/pillar at staged size),
     and a live plausibility check (noun → expected-ft range; out-of-range cells flag red).
     feat/prop-scale-framework: the plausibility ranges now live in ./prop-scale-contract.js (THE
     authoritative prop scale contract — one source of truth; this sheet only imports + checks). -->

<body>

<div id="grid"><canvas id="sheet"></canvas></div>

<!-- REAL realm-surface + realm-prop data (classic scripts) + a classic bridge that hoists their
     top-level `const`s into window (a module script can't see another script's global-lexical
     const by name). REALM_PROPS feeds the canonical-Size derivation for the dims captions. -->
<script src="../../data/realm-surfaces.js"></script>
<script src="../../data/realm-props.js"></script>
<script>
  window.REALM_SURFACES = (typeof REALM_SURFACES !== 'undefined') ? REALM_SURFACES : null;
  window.REALM_PROPS    = (typeof REALM_PROPS    !== 'undefined') ? REALM_PROPS    : null;
</script>

<script type="importmap">
{ "imports": { "three": "../../vendor/three/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';
import { resetGeom, getBuffers, V, quad } from './probe-lib.js';
import { WHOLE_OBJECT_REGISTRY } from '../../src/ui/theater-figures.js';
import { PROP_SCALE_CONTRACT } from './prop-scale-contract.js';

/* ════════════════════════ ROSTERS — enumerated LIVE from WHOLE_OBJECT_REGISTRY ════════════════════════

   The prop/light/blank rosters are no longer hand-listed: they are derived from the REAL
   src/ui/theater-figures.js registry (a pure-data ES module with no THREE/window coupling, so it
   imports directly here), which means a key registered tomorrow appears on this sheet
   automatically. 32 "prop:*" keys as of the 2026-07-08 prop-registration pass (12 base + 12
   registered by feat/prop-registration + 8 realm-bespoke). Registry `module` paths are relative
   to src/ui/ — the basename is re-anchored at ./creatures/ (same tree; R1: creatures are
   authored in place, docs/P1-WIRING.md §0.1).

   SIZE derivation (for the dims captions): a "prop:*" model staged by EXACTLY ONE
   data/realm-props.js entry inherits that entry's canonical Size (the 8 realm-bespoke props —
   each appears once, so its single Size IS the as-staged default; theater-boot.js:3583 applies
   the footprint multiplier). A model staged by MANY entries (or none) has no one canonical Size
   → footprint 1.0 (PROP_FOOTPRINT_DEFAULT, theater-boot.js:3355-3365 — the sizeless staging the
   12+12 non-realm props get through theaterPropForText). REALM_PROPS is the REAL data, loaded
   above as a classic script + bridged to window exactly like realm-surfaces.js. */
const _fileOf = e => e.module.split('/').pop();
const _sizeByModel = {};
{
  const rp = window.REALM_PROPS, seen = {};
  if(rp) for(const realm of Object.keys(rp)) for(const p of rp[realm]){
    if(!p.model || !p.model.startsWith('prop:')) continue;
    seen[p.model] = (seen[p.model]||0) + 1;
    _sizeByModel[p.model] = p.size;
  }
  for(const k of Object.keys(seen)) if(seen[k] !== 1) delete _sizeByModel[k];
}
function rosterFor(prefix){
  return Object.keys(WHOLE_OBJECT_REGISTRY).filter(k => k.startsWith(prefix)).map(key => {
    const e = WHOLE_OBJECT_REGISTRY[key];
    if(!e.module) // T2 glb-seam entries carry `glb` instead of `module` (theater-figures.js §T2) —
      return { key, file:'(glb)', fn:String(e.glb||''), missing:'glb entry — GLTFLoader path, not renderable here' };
    const r = { key, file: _fileOf(e), fn: e.fn };
    if(_sizeByModel[key]) r.size = _sizeByModel[key];
    return r;
  });
}
const PROPS  = rosterFor('prop:');   // all current "prop:*" keys, registry order
/* "light:*" keys (2 distinct builders — lavalit reuses buildTorch, magic-glow reuses
   buildCandelabra; all shown so the lighting-prop family is fully reviewable). */
const LIGHTS = rosterFor('light:');
/* The floor of the fallback chain — the blank pieces (TABLETOP-UNITS §U3). */
const BLANKS = rosterFor('blank:');

/* Authored prop modules present in dev/model-qa/creatures/ but NOT keyed under "prop:*" in
   WHOLE_OBJECT_REGISTRY — they will not stage until a walk-table part vocabulary / a "prop:" key
   points at them. DERIVED: the candidate catalog below (every authored env/dungeon prop builder
   this sheet knows of) minus whatever the live registry already points at — EMPTY since the
   2026-07-08 prop-registration pass registered all 12 former entries (they now render in the
   PROP MODELS grid with their real keys); the section renders only if a new gap appears. */
const AUTHORED_CANDIDATES = [
  {key:'BRAZIER',           file:'prop-pillar.js',      fn:'buildBrazier'},
  {key:'PORTCULLIS GATE',   file:'prop-portcullis.js',  fn:'buildPortcullis'},
  {key:'BONE-WALL',         file:'prop-bonewall.js',    fn:'buildBoneWall'},
  {key:'DRAINAGE GRATE',    file:'prop-grate.js',       fn:'buildGrate'},
  {key:'SARCOPHAGUS',       file:'prop-sarcophagus.js', fn:'buildSarcophagus'},
  {key:'HANGING CAGE',      file:'prop-hangingcage.js', fn:'buildHangingCage'},
  {key:'REFUSE PILE',       file:'prop-refuse.js',      fn:'buildRefuse'},
  {key:'WALL MANACLES',     file:'prop-manacles.js',    fn:'buildManacles'},
  {key:'GEAR CLUSTER',      file:'prop-gears.js',       fn:'buildGears'},
  {key:'INSCRIBED OBELISK', file:'prop-obelisk.js',     fn:'buildObelisk'},
  {key:'FLOATING MONOLITH', file:'prop-obelisk.js',     fn:'buildObeliskFloat'},
  {key:'STAGNANT POOL',     file:'prop-pool.js',        fn:'buildPool'},
];
const _registered = new Set(Object.values(WHOLE_OBJECT_REGISTRY)
  .filter(e => e.module).map(e => _fileOf(e) + '#' + e.fn));   // glb-seam entries carry no `module`
const AUTHORED = AUTHORED_CANDIDATES.filter(r => !_registered.has(r.file + '#' + r.fn));

/* ════════════════════════ REAL-WORLD DIMENSIONS (feat/prop-sheet-dims) ════════════════════════

   THE ENGINE SCALE CHAIN a staged prop actually receives (traced through the live mount paths):
     1. WHOLE_OBJECT_SCALE = 1.2        — src/ui/theater-boot.js:156, applied to EVERY whole-object
                                          group: props at :3576 (wg.scale.setScalar), light-props at
                                          :2980, figures at :3888.
     2. partParams.scale                — theater-boot.js:3577-3578, per-keyword-rule variants only
                                          (theater-data.js THEATER_PROP_KEYWORD_RULES, e.g. sacks
                                          {scale:0.6}); the canonical/primary staging of every
                                          registry key is scale 1.0, which is what this sheet shows.
     3. realm-prop Size footprint       — theater-boot.js:3359-3364 PROP_FOOTPRINT_BY_SIZE, applied
                                          OUTERMOST at :3583. Only entries theaterRealmPropForText
                                          resolved carry a size; the 8 realm-bespoke "prop:*" models
                                          each appear exactly ONCE in data/realm-props.js, so that
                                          single Size is their canonical as-staged multiplier. The
                                          24 non-realm props stage sizeless through this path →
                                          PROP_FOOTPRINT_DEFAULT 1.0 ("Medium-normal default",
                                          theater-boot.js:3355-3365 — NOT the 0.80 'Medium' row,
                                          which only fires when a realm prop explicitly says Medium).

   FEET-PER-ENGINE-UNIT — the derivation (and why it is genuinely ambiguous):
     GROUND/BOARD SCALE: src/engine/combat.js:32-42 (cmDimsToGrid) parses segment dims ("30' x 30'")
     into the zone grid at 1 band per 25 ft of depth, 1 lane per 20 ft of width; theater-data.js:16
     (THEATER_PATCH=3) renders each zone as a 3×3 tile patch; theater-boot.js:139 (TILE_SIZE=1) makes
     each tile 1 world unit. → 1 world unit ≈ 25/3 ≈ 8.3 ft on the depth axis, 20/3 ≈ 6.7 ft on the
     width axis. Anisotropic, and it contradicts the figures: humanoid.js authors a medium human at
     headTopY = 1.475u → staged ×1.2 = 1.77u, which at ground scale would read 12-15 ft tall. That
     is by DESIGN — this is a MINIATURES tabletop (G9 tune, theater-boot.js:146: "figure scale ~1.5x
     relative to tiles"), figures/props are deliberately oversized vs the ground grid, exactly like
     real minis on a battle map. So there is no single tile↔feet constant.
     THE YARDSTICK THAT ANSWERS ADAM'S QUESTION ("how does a piece fit into a scene?") is the human
     figure: props and figures share the same staged space (both ×WHOLE_OBJECT_SCALE), so we
     calibrate 1.77 staged units = 6.0 ft → FEET_PER_UNIT = 6.0/(1.475×1.2) ≈ 3.39. The assumption
     is labeled in the UI ("ft @ human=6ft"); under the alternate literal-ground read multiply the
     ft numbers by ~2.0-2.5, and under a flat tile=5ft assumption by 5/3.39 ≈ 1.47. */
const WHOLE_OBJECT_SCALE = 1.2;                                       // theater-boot.js:156
const PROP_FOOTPRINT_SCALE = { Small:0.55, Medium:0.80, Large:1.00, Huge:1.60 }; // theater-boot.js:3359-3364
const FEET_PER_UNIT = 6.0 / (1.475 * 1.2);                            // human-figure calibration (≈3.39)
function stageScaleFor(r){
  return WHOLE_OBJECT_SCALE * (r.size ? (PROP_FOOTPRINT_SCALE[r.size] || 1.0) : 1.0);
}

/* PLAUSIBILITY — imported from dev/model-qa/prop-scale-contract.js, THE authoritative single
   source for every prop's real-world size targets (feat/prop-scale-framework promoted the former
   inline PLAUSIBLE table there; docs/BLENDER-MODEL-SPEC.md §1b makes it the pre-modeling
   checklist). Row shape: key → { targetFt:{ h:[..], w?:[..], d?:[..] }, rationale } — h always
   claimed; w/d only where the noun makes a claim on that staged axis. A staged value outside a
   claimed range flags the cell red with the expectation printed. NEVER widen a contract range to
   green a cell — fix the model, or let the cell stay honest-red. */
const ftFmt = v => (Math.round(v*10)/10).toFixed(1);
const uFmt  = v => (Math.round(v*100)/100).toFixed(2);
/* staged dims + caption + plausibility flag for one roster entry's built bbox */
function dimsFor(r, bb){
  const s = stageScaleFor(r);
  const w = (bb.max.x-bb.min.x)*s, d = (bb.max.z-bb.min.z)*s, h = (bb.max.y-bb.min.y)*s;
  const wf = w*FEET_PER_UNIT, df = d*FEET_PER_UNIT, hf = h*FEET_PER_UNIT;
  const sizeNote = r.size ? ` ·${r.size}(×${PROP_FOOTPRINT_SCALE[r.size]})` : '';
  const dims = `${uFmt(w)}×${uFmt(d)}×${uFmt(h)} u → ${ftFmt(wf)}×${ftFmt(df)}×${ftFmt(hf)} ft (×${s.toFixed(2)}${sizeNote})`;
  const row = PROP_SCALE_CONTRACT[r.key];
  let flag = null;
  if(row){
    const t = row.targetFt;
    const out = (v, rng) => v < rng[0] || v > rng[1];
    for(const [nm, v, rng] of [['H', hf, t.h], ['W', wf, t.w], ['D', df, t.d]]){
      if(rng && out(v, rng))
        flag = (flag ? flag+' · ' : '⚠ ') + `${nm} ${ftFmt(v)}ft — expect ${rng[0]}–${rng[1]}ft`;
    }
  }
  return { dims, flag, wf, df, hf };
}

/* Resolve every distinct build fn (dynamic import, per-entry catch — one broken module skips, the
   sheet renders partial rather than dying). Mirrors ps1-sheet.html's loader. */
async function resolveAll(list){
  for(const r of list){
    if(r.missing) continue;   // pre-flagged (e.g. a glb-seam entry) — keep the honest message
    try { const m = await import('./creatures/' + r.file); r.build = m[r.fn]; if(!r.build) r.missing = 'no export'; }
    catch(e){ r.missing = 'import failed'; }
  }
}
await resolveAll(PROPS); await resolveAll(LIGHTS); await resolveAll(BLANKS); await resolveAll(AUTHORED);

/* THEATER_ENV_PALETTE — inlined numeric mirror of src/engine/theater-data.js's env tops/sides
   (2026-07-08 saturation-lifted values; the altTop checker tone is RETIRED — one room-wide tint).
   4 entries; kept small to avoid loading the whole classic engine chain. */
const THEATER_ENV_PALETTE = {
  dungeon:    { top:0x6e5844, side:0x241f1a },
  urban:      { top:0x857763, side:0x2c2822 },
  wilderness: { top:0x58603a, side:0x22241a },
  breach:     { top:0x604a62, side:0x1e181c },
};

/* ════════════════════════ ENGINE PS1 TUNABLES (theater-boot.js) ════════════════════════ */
const PSX_DITHER_AMPLITUDE = 48.0, PSX_VERTEX_SNAP_GRID = 96;
const _resParam = parseFloat(new URLSearchParams(location.search).get('res'));
const PSX_RES_SCALE = (Number.isFinite(_resParam) && _resParam > 0 && _resParam <= 1) ? _resParam : 1/3;
const VOID_BG = 0x0a0908;
const GRAIN = new URLSearchParams(location.search).get('grain') !== '0';
const SPEC  = new URLSearchParams(location.search).get('spec')  !== '0';
const DITHER_GLSL = `
  #ifdef PSX_DITHER
  {
    const float bayer4x4[16] = float[16](
      0.0,  8.0,  2.0, 10.0, 12.0, 4.0, 14.0,  6.0,
      3.0, 11.0,  1.0,  9.0, 15.0, 7.0, 13.0,  5.0);
    int dx = int(mod(gl_FragCoord.x, 4.0));
    int dy = int(mod(gl_FragCoord.y, 4.0));
    float threshold = (bayer4x4[dy * 4 + dx] / 16.0 - 0.5) * (1.0 / ${PSX_DITHER_AMPLITUDE.toFixed(1)});
    outgoingLight += threshold;
  }
  #endif`;
const VERTEX_SNAP_GLSL = `
  #ifdef PSX_VERTEX_SNAP
  {
    float snapGrid = ${PSX_VERTEX_SNAP_GRID.toFixed(1)};
    vec4 snapped = gl_Position;
    snapped.xy = round((snapped.xy / snapped.w) * snapGrid) / snapGrid * snapped.w;
    gl_Position = snapped;
  }
  #endif`;
function applyPsxShaderTweaks(material){
  material.onBeforeCompile = (shader) => {
    shader.fragmentShader = "#define PSX_DITHER\n" + shader.fragmentShader.replace(
      "#include <opaque_fragment>", DITHER_GLSL + "\n  #include <opaque_fragment>");
    shader.vertexShader = "#define PSX_VERTEX_SNAP\n" + shader.vertexShader.replace(
      "#include <project_vertex>", "#include <project_vertex>\n  " + VERTEX_SNAP_GLSL);
  };
  return material;
}

/* ── TEXEL GRAIN (byte-faithful ps1-sheet copy) ── */
let _grainTex = null;
function grainTexture(){
  if(_grainTex) return _grainTex;
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const g = c.getContext('2d');
  g.fillStyle = '#f2f2f2'; g.fillRect(0,0,128,128);
  let s = 987654321 >>> 0;
  const rnd = () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296);
  for(let i=0;i<170;i++){ const v = (0.86 + rnd()*0.10)*255|0; g.fillStyle=`rgb(${v},${v},${v})`;
    g.fillRect((rnd()*128)|0,(rnd()*128)|0,3+((rnd()*4)|0),3+((rnd()*4)|0)); }
  for(let i=0;i<4200;i++){ const dark=rnd()<0.85; const v=dark?0.60+rnd()*0.34:1.0; const vv=(v*255)|0;
    g.fillStyle=`rgb(${vv},${vv},${vv})`; g.fillRect((rnd()*128)|0,(rnd()*128)|0,1+((rnd()*3)|0),1+((rnd()*3)|0)); }
  for(let i=0;i<110;i++){ const x=(rnd()*128)|0,y=(rnd()*128)|0,len=2+(rnd()*6)|0,v=(0.58+rnd()*0.16)*255|0;
    g.fillStyle=`rgb(${v},${v},${v})`; g.fillRect(x,y,rnd()<0.5?len:1,rnd()<0.5?1:len); }
  _grainTex = new THREE.CanvasTexture(c);
  _grainTex.magFilter = THREE.NearestFilter; _grainTex.minFilter = THREE.NearestFilter;
  _grainTex.generateMipmaps = false;
  return _grainTex;
}
function quadUVs(triCount){
  const uv = new Float32Array(triCount*3*2);
  const CELLS = 14, W = 2/16;
  let h = 2463534242 >>> 0;
  const hash = () => ((h=(h^(h<<13))>>>0, h=(h^(h>>>17))>>>0, h=(h^(h<<5))>>>0)/4294967296);
  for(let t=0;t<triCount;t++){
    if(t%2===0){ var cu=(hash()*CELLS|0)/16, cv=(hash()*CELLS|0)/16; }
    const o=t*6; uv[o]=cu; uv[o+1]=cv; uv[o+2]=cu+W; uv[o+3]=cv; uv[o+4]=cu+(t%2?W:0); uv[o+5]=cv+W;
  }
  return uv;
}
function matBucket(r,g,b){
  const v=Math.max(r,g,b), sat=v-Math.min(r,g,b);
  if(b>r && b>g && v>0.55) return 2;
  if(r>g*1.12 && g>b*1.45 && v>0.35 && sat>0.15) return 1;
  if(sat<0.09 && v>0.40 && v<0.74 && b>=r) return 1;
  return 0;
}

/* shared lights + dimetric ortho camera from a mesh's bbox */
function lightsAndCam(scene, bb, elev){
  const ctr = bb.getCenter(new THREE.Vector3()), sz = bb.getSize(new THREE.Vector3());
  const reach = Math.max(sz.x, sz.y, sz.z) * 0.5;
  const key = new THREE.DirectionalLight(0xffffff, 0.72); key.position.set(5,9,7); scene.add(key);
  const fill= new THREE.DirectionalLight(0xffffff, 0.22); fill.position.set(-5,4,-6); scene.add(fill);
  scene.add(new THREE.AmbientLight(0xffffff, 0.32));
  const yaw=45*Math.PI/180, el=(elev||30)*Math.PI/180, d=30, cy=ctr.y;
  const cam = new THREE.OrthographicCamera(-1,1,1,-1,0.1,120);
  cam.position.set(Math.sin(yaw)*Math.cos(el)*d, Math.sin(el)*d+cy, Math.cos(yaw)*Math.cos(el)*d);
  cam.lookAt(0, cy*0.92, 0);
  return {cam, reach, cy};
}

/* PROP / FIGURE geometry+materials builder — the authoring/bucketing half of the old figureScene,
   factored out (feat/prop-sheet-dims) so the SCALE AUDIT strip can compose several built pieces
   into ONE scene. Byte-faithful to ps1-sheet's pipeline. Returns {geo, mats, bb} — bb is the
   built geometry's THREE.Box3 (geo.boundingBox), the raw authored bbox the dims captions scale. */
function builtGeoAndMats(fn, opts={}){
  const grain = opts.grain !== undefined ? opts.grain : GRAIN;
  const spec  = opts.spec  !== undefined ? opts.spec  : SPEC;
  const side  = opts.side || THREE.FrontSide;
  resetGeom(); fn();
  const {POS, COL} = getBuffers();
  const triCount = POS.length/9;
  const uvAll = quadUVs(triCount);
  const buckets = [[],[],[]];
  for(let t=0;t<triCount;t++){
    const r=(COL[t*9]+COL[t*9+3]+COL[t*9+6])/3, g=(COL[t*9+1]+COL[t*9+4]+COL[t*9+7])/3, b=(COL[t*9+2]+COL[t*9+5]+COL[t*9+8])/3;
    buckets[spec ? matBucket(r,g,b) : 0].push(t);
  }
  const pos=new Float32Array(POS.length), col=new Float32Array(COL.length), uv=new Float32Array(triCount*6);
  let w=0; const ranges=[];
  for(const bkt of buckets){ const start=w;
    for(const t of bkt){ pos.set(POS.slice(t*9,t*9+9), w*9); col.set(COL.slice(t*9,t*9+9), w*9);
      uv.set(uvAll.slice(t*6,t*6+6), w*6); w++; }
    ranges.push([start*3, (w-start)*3]);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setAttribute('color',    new THREE.Float32BufferAttribute(col, 3));
  if(grain) geo.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  ranges.forEach(([s,c],i)=>{ if(c>0) geo.addGroup(s,c,i); });
  geo.computeVertexNormals(); geo.computeBoundingBox();
  const base = {vertexColors:true, flatShading:true, side};
  if(grain) base.map = grainTexture();
  const mats = [
    applyPsxShaderTweaks(new THREE.MeshLambertMaterial({...base})),
    applyPsxShaderTweaks(new THREE.MeshPhongMaterial({...base, shininess:46, specular:0x8a8f94})),
    applyPsxShaderTweaks(new THREE.MeshPhongMaterial({...base, shininess:95, specular:0xbfdbe8})),
  ];
  return { geo, mats, bb: geo.boundingBox };
}

/* PROP / FIGURE scene — byte-faithful ps1-sheet figureScene, parametrized (grain/spec/board off for
   floor authoring). `fn` authors geometry via probe-lib between resetGeom() and getBuffers().
   feat/prop-sheet-dims: also returns `bb` (the built geometry's bounding box) for the dims captions. */
function figureScene(fn, opts={}){
  const {geo, mats, bb} = builtGeoAndMats(fn, opts);
  const scene = new THREE.Scene(); scene.background = new THREE.Color(VOID_BG);
  scene.add(new THREE.Mesh(geo, mats));
  const {cam, reach, cy} = lightsAndCam(scene, bb, opts.elev);
  if(!opts.noBoard){
    const tileMat = applyPsxShaderTweaks(new THREE.MeshLambertMaterial({color:0x2a241d}));
    const tile = new THREE.Mesh(new THREE.PlaneGeometry(reach*2.1, reach*2.1), tileMat);
    tile.rotation.x = -Math.PI/2; tile.position.set(0, bb.min.y-0.002, 0); scene.add(tile);
  }
  return {scene, cam, reach, cy, bb};
}

/* SCALE AUDIT strip scene (feat/prop-sheet-dims §3): several roster pieces composed into ONE scene,
   EACH AT ITS STAGED SCALE, standing side by side on a shared ground plane — the instant
   proportion read (human meeple next to table/cart/pillar). Returns null if no ref resolved. */
function auditScene(refs, cellAsp){
  const scene = new THREE.Scene(); scene.background = new THREE.Color(VOID_BG);
  const all = new THREE.Box3();
  let x = 0, placed = 0, heights = [];
  for(const r of refs){
    if(!r || !r.build) { heights.push(null); continue; }
    const {geo, mats, bb} = builtGeoAndMats(r.build);
    const s = stageScaleFor(r);
    const halfW = (bb.max.x - bb.min.x) * s / 2;
    x += halfW + (placed ? 0.35 : 0);
    const mesh = new THREE.Mesh(geo, mats);
    mesh.scale.setScalar(s);
    mesh.position.set(x, -bb.min.y * s, 0);   // feet on y=0 regardless of authored base
    scene.add(mesh);
    const sb = new THREE.Box3(
      new THREE.Vector3(x + bb.min.x*s, 0,                       bb.min.z*s),
      new THREE.Vector3(x + bb.max.x*s, (bb.max.y-bb.min.y)*s,   bb.max.z*s));
    all.union(sb);
    heights.push((bb.max.y - bb.min.y) * s * FEET_PER_UNIT);
    x += halfW;
    placed++;
  }
  if(!placed) return null;
  const {cam} = lightsAndCam(scene, all, 14);   // low elevation — a lineup read, not a board read
  // recenter the ortho cam on the lineup's midpoint (lightsAndCam aims at x=0)
  const ctr = all.getCenter(new THREE.Vector3());
  cam.position.x += ctr.x; cam.lookAt(ctr.x, ctr.y*0.92, 0);
  // frame on the lineup itself (the render loop sets the ortho half-height to reach*1.45 with the
  // cell's aspect) — a full-width cell would otherwise dwarf the pieces, so derive `reach` from
  // whichever of the lineup's height / aspect-corrected width actually binds.
  const sz = all.getSize(new THREE.Vector3());
  const reach = Math.max(sz.y*0.5, (sz.x*0.5)/(cellAsp || 1)) * 1.25 / 1.45;
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(Math.max(sz.x*1.3, 4), Math.max(sz.z*3, 3)),
    applyPsxShaderTweaks(new THREE.MeshLambertMaterial({color:0x2a241d})));
  ground.rotation.x = -Math.PI/2; ground.position.set(ctr.x, -0.002, 0); scene.add(ground);
  return {scene, cam, reach, cy: ctr.y, heights};
}

/* ════════════════════════ FLOOR SURFACES ════════════════════════ */

/* ── ENV BOARD: a 3×3 patch of raised tiles (ONE room-wide top tint — the checker was retired
     2026-07-08; `side` vertical faces) — the same board grammar theater-boot's board build uses.
     Authored via probe-lib quad(). ── */
function envBoardBuilder(pal){
  return function(){
    const s = 0.5, h = 0.11, hs = s/2;
    const box = (cx,cz,topHex)=>{
      const p=(x,y,z)=>V(cx+x, y, cz+z);
      quad(p(-hs,h,-hs), p(hs,h,-hs), p(hs,h,hs), p(-hs,h,hs), topHex, 0);            // top
      quad(p(-hs,0,-hs), p(hs,0,-hs), p(hs,h,-hs), p(-hs,h,-hs), pal.side, 0);        // -z
      quad(p(hs,0,hs),  p(-hs,0,hs), p(-hs,h,hs), p(hs,h,hs),   pal.side, 0);         // +z
      quad(p(hs,0,-hs), p(hs,0,hs),  p(hs,h,hs),  p(hs,h,-hs),  pal.side, 0);         // +x
      quad(p(-hs,0,hs), p(-hs,0,-hs),p(-hs,h,-hs),p(-hs,h,hs),  pal.side, 0);         // -x
    };
    for(let i=-1;i<=1;i++) for(let j=-1;j<=1;j++) box(i*s, j*s, pal.top); // one room-wide tint (checker retired 2026-07-08)
  };
}

/* ── FLOOR-MATERIAL RECIPE: byte-faithful copy of src/ui/theater-boot.js (helpers L273-523,
     FLOOR_MATERIAL_BASE L515-521, FLOOR_MATERIAL_RECIPES L525-662, buildFloorMaterialCanvas
     L664-696). Reproduced inline because theater-boot.js is the classic engine-boot script and
     cannot be import()ed standalone — same reason ps1-sheet reproduces the PSX shader. ── */
function mulberry32(seed){ let a=seed>>>0; return function(){ a|=0; a=(a+0x6D2B79F5)|0;
  let t=Math.imul(a^(a>>>15),1|a); t=(t+Math.imul(t^(t>>>7),61|t))^t; return ((t^(t>>>14))>>>0)/4294967296; }; }
function clamp255(v){ return v<0?0:(v>255?255:v|0); }
function hexToRGB(hex){ const n=(typeof hex==="number"&&isFinite(hex))?(hex&0xffffff):0x808080;
  return { r:(n>>16)&0xff, g:(n>>8)&0xff, b:n&0xff }; }
function scaleRGB(c,f){ return { r:c.r*f, g:c.g*f, b:c.b*f }; }
function mixRGB(a,b,tB){ const tA=1-tB; return { r:a.r*tA+b.r*tB, g:a.g*tA+b.g*tB, b:a.b*tA+b.b*tB }; }
function swarmHashLocal(i,salt){ let h=((i+1)*374761393+salt*668265263)|0;
  h=(h^(h>>>13))|0; h=Math.imul(h,1274126177)|0; return ((h^(h>>>16))>>>0)/4294967296; }
const FLOOR_TEX_SIZE = 64;
const FLOOR_MATERIAL_BASE = {
  flagstone:0x6f6f74, cobble:0x777069, "cracked-earth":0x7d6a4c, "cave-rock":0x615c53,
  grass:0x5c7038, "leaf-litter":0x6d5a35, sand:0xbcac7c, "snow-ice":0xccd4e0,
  mud:0x4f4335, scree:0x827c73, plank:0x715736, ash:0x84817b,
  grating:0x585d64, asphalt:0x3a3c40, "void-floor":0x141620, "rope-matting":0x8a7854, "candy-tile":0xd85a84,
};
const FLOOR_MATERIAL_RECIPES = {
  flagstone(c){ const cols=4,rows=4; const cx=(c.ht*cols)%1, cy=(c.vt*rows)%1;
    const grout=cx<0.06||cx>0.94||cy<0.06||cy>0.94;
    const blockJitter=swarmHashLocal(Math.floor(c.ht*cols)*13+Math.floor(c.vt*rows)*7,3);
    let mul=0.92+blockJitter*0.2; if(grout) mul*=0.55; return scaleRGB(c.base,mul); },
  cobble(c){ const cellsX=8,cellsY=8; const cx=(c.ht*cellsX)%1-0.5, cy=(c.vt*cellsY)%1-0.5;
    const d=Math.sqrt(cx*cx+cy*cy);
    const cellJitter=swarmHashLocal(Math.floor(c.ht*cellsX)*17+Math.floor(c.vt*cellsY)*11,5);
    let mul=0.88+cellJitter*0.3; if(d>0.42) mul*=0.5; return scaleRGB(c.base,mul); },
  "cracked-earth"(c){ const blot=swarmHashLocal(Math.floor(c.ht*10)*13+Math.floor(c.vt*10)*7,11);
    let mul=0.82+blot*0.34; const crack=Math.abs(((c.ht*3+c.vt*2)%1)-0.5)<0.025; if(crack) mul*=0.55;
    return scaleRGB(c.base,mul); },
  "cave-rock"(c){ const blot=swarmHashLocal(Math.floor(c.ht*9)*19+Math.floor(c.vt*9)*23,17);
    let mul=0.75+blot*0.5; const pit=swarmHashLocal(Math.floor(c.ht*14)*5+Math.floor(c.vt*14)*31,29)>0.92;
    if(pit) mul*=0.4; return scaleRGB(c.base,mul); },
  grass(c){ const streak=swarmHashLocal(Math.floor(c.x/1)+Math.floor(c.y/2)*3,7);
    let mul=0.85+streak*0.3; if((c.y%2)===0 && streak>0.55) mul*=1.12; return scaleRGB(c.base,mul); },
  "leaf-litter"(c){ let mul=0.7; const leaf=swarmHashLocal(Math.floor(c.ht*12)*41+Math.floor(c.vt*12)*3,13)>0.72;
    if(leaf) mul=0.95+swarmHashLocal(Math.floor(c.ht*12),19)*0.35; return scaleRGB(c.base,mul); },
  sand(c){ const ripple=Math.sin(c.vt*Math.PI*10+c.ht*1.5); let mul=1+ripple*0.1;
    const grain=swarmHashLocal(Math.floor(c.x)+Math.floor(c.y)*71,3); mul*=0.94+grain*0.12; return scaleRGB(c.base,mul); },
  "snow-ice"(c){ const sheen=Math.sin(c.vt*Math.PI*4+c.ht*2.2); let mul=1.05+sheen*0.06;
    const sparkle=swarmHashLocal(Math.floor(c.x)*3+Math.floor(c.y)*97,41)>0.94; const col=scaleRGB(c.base,mul);
    if(sparkle) return { r:col.r*1.3+20, g:col.g*1.3+20, b:col.b*1.35+25 }; return col; },
  mud(c){ const blot=swarmHashLocal(Math.floor(c.ht*7)*13+Math.floor(c.vt*7)*29,23); let mul=0.68+blot*0.3;
    const puddle=swarmHashLocal(Math.floor(c.ht*5)*3+Math.floor(c.vt*5)*7,31)>0.85; if(puddle) mul*=0.5;
    return scaleRGB(c.base,mul); },
  scree(c){ const cell=swarmHashLocal(Math.floor(c.ht*11)*37+Math.floor(c.vt*11)*43,7); let mul=0.7+cell*0.55;
    return scaleRGB(c.base,mul); },
  plank(c){ const planks=5, pp=c.vt*planks, seam=pp-Math.floor(pp); let mul=1; if(seam<0.06) mul*=0.55;
    const grain=swarmHashLocal(Math.floor(c.x/1)+Math.floor(pp)*53,9); mul*=0.9+grain*0.22; return scaleRGB(c.base,mul); },
  ash(c){ const fleck=swarmHashLocal(Math.floor(c.x)*3+Math.floor(c.y)*89,53); const mul=0.8+fleck*0.4;
    return scaleRGB(c.base,mul); },
  grating(c){ const cells=6, cx=(c.ht*cells)%1-0.5, cy=(c.vt*cells)%1-0.5; const d=Math.max(Math.abs(cx),Math.abs(cy));
    let mul=0.95+swarmHashLocal(Math.floor(c.ht*cells)*7+Math.floor(c.vt*cells)*13,5)*0.12;
    if(d<0.30) mul*=0.18; else if(d<0.37) mul*=0.5; return scaleRGB(c.base,mul); },
  asphalt(c){ const grain=swarmHashLocal(Math.floor(c.x)*3+Math.floor(c.y)*61,41); const s=(c.ht+c.vt)%1;
    if(s>0.46 && s<0.54) return { r:150+grain*36, g:148+grain*36, b:136+grain*36 };
    return scaleRGB(c.base,0.82+grain*0.30); },
  "void-floor"(c){ const star=swarmHashLocal(Math.floor(c.x*1.3)*17+Math.floor(c.y*1.3)*29,71);
    if(star>0.972){ const b=180+(star-0.972)/0.028*70; return { r:b*0.88, g:b*0.94, b:b }; }
    const seam=((c.ht*3)%1)<0.05 || ((c.vt*3)%1)<0.05;
    let mul=0.7+swarmHashLocal(Math.floor(c.ht*3)*5+Math.floor(c.vt*3)*7,3)*0.5; if(seam) mul*=1.4; return scaleRGB(c.base,mul); },
  "rope-matting"(c){ const strands=7, sx=Math.floor(c.ht*strands), sy=Math.floor(c.vt*strands);
    const over=((sx+sy)%2)===0; const along=over?((c.vt*strands)%1-0.5):((c.ht*strands)%1-0.5);
    let mul=(0.78+(1-Math.abs(along)*2)*0.32)*(over?1.0:0.86); return scaleRGB(c.base,mul); },
  "candy-tile"(c){ const cells=4, on=((Math.floor(c.ht*cells)+Math.floor(c.vt*cells))%2)===0;
    const jit=1+(swarmHashLocal(Math.floor(c.ht*cells)*3+Math.floor(c.vt*cells)*7,9)-0.5)*0.10;
    return on ? { r:222*jit, g:98*jit, b:134*jit } : { r:150*jit, g:210*jit, b:190*jit }; },
};
function buildFloorMaterialCanvas(material, colorHex, seed, realmLead){
  // mirrors src/ui/theater-boot.js's 2026-07-08 mixing: realm-led (authored baseTint carries, 12%
  // material hue nudge) when realmLead, else material-led with the env mix reduced 0.30 -> 0.12.
  const size=FLOOR_TEX_SIZE;
  const canvas=document.createElement("canvas"); canvas.width=size; canvas.height=size;
  const ctx=canvas.getContext("2d"); const img=ctx.createImageData(size,size); const data=img.data;
  const envRGB=hexToRGB(colorHex); const matHex=FLOOR_MATERIAL_BASE[material];
  const base=(matHex!=null)?(realmLead?mixRGB(envRGB,hexToRGB(matHex),0.12):mixRGB(hexToRGB(matHex),envRGB,0.12)):envRGB;
  const bands=[scaleRGB(base,0.80),base,scaleRGB(base,1.18)];
  const rand=mulberry32(seed); const speckle=new Uint8Array(size*size);
  for(let i=0;i<size*size;i++){ speckle[i]=rand()<0.05?1:0; }
  const set=(x,y,r,g,b)=>{ const o=(y*size+x)*4; data[o]=clamp255(r);data[o+1]=clamp255(g);data[o+2]=clamp255(b);data[o+3]=255; };
  const recipe=FLOOR_MATERIAL_RECIPES[material]||FLOOR_MATERIAL_RECIPES.flagstone;
  for(let y=0;y<size;y++){ const vt=y/(size-1);
    for(let x=0;x<size;x++){ const ht=x/(size-1);
      const col=recipe({x,y,vt,ht,base,bands,rand}); const jitter=1+(rand()-0.5)*0.08;
      let r=col.r*jitter,g=col.g*jitter,b=col.b*jitter;
      if(speckle[y*size+x]){ r*=0.75; g*=0.75; b*=0.75; } set(x,y,r,g,b);
    }
  }
  ctx.putImageData(img,0,0); return canvas;
}
/* the no-baseTint fallback tint only (2026-07-08: a realm surface renders under its OWN authored
   baseTint via the tint funnel — this env top is what an un-authored surface would fall back to). */
const REALM_FLOOR_TINT = THEATER_ENV_PALETTE.breach.top;
function seedFor(str){ let h=0; for(let i=0;i<str.length;i++){ h=((h<<5)-h+str.charCodeAt(i))|0; } return (h>>>0)||1; }

/* a flat textured floor plane (recipe swatch), tilted to a board-legible elevation, through the shader */
function recipeTileScene(material, tintHex, seedKey, realmLead){
  const canvas = buildFloorMaterialCanvas(material, tintHex, seedFor(seedKey), !!realmLead);
  const tex = new THREE.CanvasTexture(canvas);
  tex.magFilter = THREE.NearestFilter; tex.minFilter = THREE.NearestFilter; tex.generateMipmaps = false;
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping; tex.repeat.set(2,2);
  const size = 1.4;
  const geo = new THREE.PlaneGeometry(size, size); geo.rotateX(-Math.PI/2); geo.computeBoundingBox();
  const mat = applyPsxShaderTweaks(new THREE.MeshLambertMaterial({map:tex, side:THREE.DoubleSide, flatShading:true}));
  const scene = new THREE.Scene(); scene.background = new THREE.Color(VOID_BG);
  scene.add(new THREE.Mesh(geo, mat));
  const {cam, reach, cy} = lightsAndCam(scene, geo.boundingBox, 58);
  return {scene, cam, reach, cy};
}

/* ════════════════════════ LAYOUT (one canvas, stacked scissor grids) ════════════════════════ */
const COLS = 4, CW = 340, HDR_H = 46, SEC_GAP = 20;
let cursorY = 0;
const placed = [];   // {x,y,w,h,elev,cell}
const headers = [];  // {y, title, sub}
for(const sec of sections){
  headers.push({ y:cursorY, title:sec.title, sub:sec.sub });
  cursorY += HDR_H;
  const ch = sec.ch;
  if(sec.wide){
    // feat/prop-sheet-dims: a wide section's every cell spans the full sheet width, one per row
    // (the SCALE AUDIT strip) — the standard grid below is untouched.
    sec.cells.forEach((cell, i)=>{ placed.push({ x:0, y:cursorY + i*ch, w:COLS*CW, h:ch, cell }); });
    cursorY += sec.cells.length*ch + SEC_GAP;
    continue;
  }
  sec.cells.forEach((cell, i)=>{
    const col = i%COLS, row = (i/COLS)|0;
    placed.push({ x:col*CW, y:cursorY + row*ch, w:CW, h:ch, cell });
  });
  const rows = Math.max(1, Math.ceil(sec.cells.length/COLS));
  cursorY += rows*ch + SEC_GAP;
}
const cssW = COLS*CW, cssH = cursorY;

const canvas = document.getElementById('sheet');
canvas.style.width = cssW+'px'; canvas.style.height = cssH+'px';
const bufW = Math.round(cssW*PSX_RES_SCALE), bufH = Math.round(cssH*PSX_RES_SCALE);
const renderer = new THREE.WebGLRenderer({canvas, antialias:false, alpha:false, preserveDrawingBuffer:true});
renderer.setClearColor(VOID_BG, 1);
renderer.setSize(bufW, bufH, false);
renderer.setScissorTest(true);

const grid = document.getElementById('grid');
// section headers
for(const hd of headers){
  const el = document.createElement('div'); el.className='hdr';
  el.style.top = hd.y+'px'; el.style.width = cssW+'px';
  el.innerHTML = `${hd.title} &nbsp;<span class="hsub">${hd.sub}</span>`;
  grid.appendChild(el);
}
// cells
let rendered = 0, gaps = 0, misses = 0, flagged = 0;
for(const p of placed){
  const c = p.cell;
  if(c.scene){
    const px = Math.round(p.x*PSX_RES_SCALE), pw = Math.round(p.w*PSX_RES_SCALE), ph = Math.round(p.h*PSX_RES_SCALE);
    const py = bufH - Math.round((p.y+p.h)*PSX_RES_SCALE);
    const asp = p.w/p.h, hh = c.reach*1.45;
    c.cam.left=-hh*asp; c.cam.right=hh*asp; c.cam.top=hh; c.cam.bottom=-hh; c.cam.updateProjectionMatrix();
    renderer.setViewport(px,py,pw,ph); renderer.setScissor(px,py,pw,ph);
    renderer.render(c.scene, c.cam);
    rendered++;
  }
  if(c.cls==='gap') gaps++; if(c.cls==='miss') misses++; if(c.flag) flagged++;
  // feat/prop-sheet-dims: label grew a dims caption line (+ a red plausibility flag line when the
  // staged size falls outside the noun's PLAUSIBLE range) — lifted to fit up to 4 lines.
  const extra = (c.dims ? 13 : 0) + (c.flag ? 13 : 0);
  const lab = document.createElement('div'); lab.className='lbl '+(c.cls||'');
  lab.style.left=p.x+'px'; lab.style.top=(p.y+p.h-40-extra)+'px'; lab.style.width=p.w+'px';
  lab.innerHTML = `<div class="nm">${c.label}</div><div class="path">${c.path}</div>`
    + (c.dims ? `<div class="dims">${c.dims}</div>` : '')
    + (c.flag ? `<div class="flag">${c.flag}</div>` : '');
  grid.appendChild(lab);
}

document.getElementById('stat').textContent =
  `${rendered} rendered · ${gaps} unregistered-gap · ${misses} unresolved · ${flagged} SCALE-FLAGGED · ft @ human=6ft (1u≈${(6.0/(1.475*1.2)).toFixed(2)}ft staged) · props+lights+blanks+floors · engine-PS1 (dither+vertex-snap+1/${(1/PSX_RES_SCALE).toFixed(1)}-res)`;
window.__ready = true;
</script>
</body>
</html>
