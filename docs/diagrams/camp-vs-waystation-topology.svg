<svg viewBox="0 0 720 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="wt wd" font-family="ui-sans-serif, -apple-system, 'Segoe UI', sans-serif">
<title id="wt">Camp vs waystation — ring vs frontage topologies + the permanence ladder (RULED 2026-07-24)</title>
<desc id="wd">Two plan-view panels: the camp's inward ring topology around a fire beside a screened route, versus the waystation's outward frontage topology addressing the road with an apron pull-off. Below, the ruled three-rung permanence ladder: bare campsite, customary ground, waystation. Two rollers, one technology.</desc>
<rect x="0" y="0" width="720" height="420" fill="#FFFFFF"/>

<rect x="10" y="30" width="340" height="270" rx="8" fill="#F4F7EE" stroke="#B9C4A6"/>
<rect x="370" y="30" width="340" height="270" rx="8" fill="#F4F7EE" stroke="#B9C4A6"/>
<text x="24" y="54" font-size="13" font-weight="700" fill="#2A2A2A">CAMP — inward ring (rungs 0–1)</text>
<text x="384" y="54" font-size="13" font-weight="700" fill="#2A2A2A">WAYSTATION — outward frontage (rung 2)</text>

<!-- LEFT: camp ring -->
<circle cx="180" cy="160" r="12" fill="none" stroke="#B4552D" stroke-width="2.5"/>
<text x="150" y="140" font-size="11" fill="#555349">fire</text>
<g fill="#E8D9B0" stroke="#8A6B3F" stroke-width="1.5">
  <path d="M 110 130 L 128 100 L 146 130 Z"/>
  <path d="M 214 128 L 232 98 L 250 128 Z"/>
  <path d="M 108 216 L 126 186 L 144 216 Z"/>
  <path d="M 216 218 L 234 188 L 252 218 Z"/>
</g>
<circle cx="180" cy="160" r="62" fill="none" stroke="#B9C4A6" stroke-width="1" stroke-dasharray="4 5"/>
<g stroke="#8A8377" stroke-width="1.5">
  <line x1="180" y1="92" x2="180" y2="78"/>
  <line x1="248" y1="160" x2="262" y2="160"/>
  <line x1="180" y1="228" x2="180" y2="242"/>
  <line x1="112" y1="160" x2="98" y2="160"/>
</g>
<text x="196" y="86" font-size="10" fill="#6B675E">watch faces out</text>
<g fill="#97C459" stroke="#3B6D11">
  <circle cx="60" cy="262" r="12"/><circle cx="98" cy="272" r="10"/><circle cx="140" cy="278" r="12"/><circle cx="186" cy="282" r="10"/>
</g>
<path d="M 20 292 Q 180 276 348 288" fill="none" stroke="#D3D1C7" stroke-width="10"/>
<text x="226" y="272" font-size="10" fill="#6B675E">route screened</text>

<!-- RIGHT: waystation frontage -->
<path d="M 380 262 L 700 262" stroke="#D3D1C7" stroke-width="18"/>
<text x="388" y="290" font-size="10" fill="#6B675E">road — wants to be found</text>
<path d="M 470 253 Q 540 226 620 253 Q 545 244 470 253 Z" fill="#E4E1D6" stroke="#888780" stroke-width="1"/>
<text x="512" y="244" font-size="10" fill="#555349">apron (no gate)</text>
<rect x="460" y="120" width="86" height="52" fill="#E8D9B0" stroke="#8A6B3F" stroke-width="1.5"/>
<path d="M 460 120 L 503 96 L 546 120 Z" fill="#C89A5B" stroke="#7A5A2E" stroke-width="1.5"/>
<rect x="492" y="148" width="22" height="24" fill="#FFFFFF" stroke="#8A6B3F"/>
<text x="446" y="88" font-size="11" fill="#555349">shed (site-1 inherit)</text>
<rect x="586" y="112" width="88" height="66" rx="4" fill="none" stroke="#8A6B3F" stroke-width="2" stroke-dasharray="8 5"/>
<text x="596" y="102" font-size="11" fill="#555349">corral run</text>
<rect x="556" y="150" width="24" height="10" fill="#E8D9B0" stroke="#8A6B3F"/>
<text x="548" y="145" font-size="10" fill="#6B675E">trough</text>
<g fill="#C89A5B" stroke="#7A5A2E">
  <circle cx="432" cy="196" r="6"/><circle cx="445" cy="196" r="6"/><circle cx="438" cy="186" r="6"/>
</g>
<text x="404" y="216" font-size="10" fill="#6B675E">woodpile</text>
<g stroke="#B4552D" stroke-width="1.5" fill="none">
  <line x1="503" y1="180" x2="503" y2="216"/>
  <path d="M 498 210 L 503 219 L 508 210"/>
</g>
<text x="512" y="206" font-size="10" fill="#B4552D">faces the road</text>

<!-- permanence ladder -->
<text x="14" y="330" font-size="13" font-weight="700" fill="#2A2A2A">The permanence ladder — one kit, rung × occupancy · TWO ROLLERS, ONE TECHNOLOGY</text>
<g font-size="11">
  <rect x="14" y="344" width="212" height="52" rx="6" fill="#F4F7EE" stroke="#B9C4A6"/>
  <text x="26" y="364" font-weight="700" fill="#2A2A2A">Rung 0 — bare campsite</text>
  <text x="26" y="381" fill="#6B675E">zero standing pieces</text>
  <rect x="252" y="344" width="212" height="52" rx="6" fill="#F4F7EE" stroke="#B9C4A6"/>
  <text x="264" y="364" font-weight="700" fill="#2A2A2A">Rung 1 — customary ground</text>
  <text x="264" y="381" fill="#6B675E">traces persist, built by none</text>
  <rect x="490" y="344" width="216" height="52" rx="6" fill="#F4F7EE" stroke="#B4552D" stroke-width="1.5"/>
  <text x="502" y="364" font-weight="700" fill="#2A2A2A">Rung 2 — waystation</text>
  <text x="502" y="381" fill="#6B675E">takes root: shed, corral, apron</text>
</g>
<g stroke="#8A8377" stroke-width="1.5" fill="none">
  <line x1="226" y1="370" x2="248" y2="370"/><path d="M 243 365 L 251 370 L 243 375"/>
  <line x1="464" y1="370" x2="486" y2="370"/><path d="M 481 365 L 489 370 L 481 375"/>
</g>
<text x="14" y="414" font-size="10" fill="#6B675E">camp roller owns rungs 0–1 (ring archetype) · waystation roller owns rung 2 (frontage archetype) · module test deferred until the twelve sites are done</text>
</svg>
