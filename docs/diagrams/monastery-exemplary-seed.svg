<svg viewBox="0 0 720 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="mt md" font-family="ui-sans-serif, -apple-system, 'Segoe UI', sans-serif">
<title id="mt">The first-build monastery seed — level court and high chapel</title>
<desc id="md">Plan view of the current first-build monastery recommendation: a walled compound on a hillside above a valley road, reached by a spur path from a wayside shrine to a centered gate in the low end wall. A level courtyard is wrapped by a repeated arcade, and one broad stair rises to the chapel platform at the high end. The shared hall sits along the top range, a shared dormitory along the bottom, garden terraces near the low end, a central well, and a bell tower is licensed only for militant or defended orders.</desc>
<rect x="0" y="0" width="720" height="520" fill="#FFFFFF"/>

<text x="14" y="22" font-size="13" font-weight="700" fill="#2A2A2A">First build (B) — center gate, level court, chapel high</text>
<text x="14" y="39" font-size="11" fill="#6B675E">a walled compound on a hillside bench above the valley road</text>

<rect x="170" y="80" width="470" height="272" rx="4" fill="#F4F0E6" stroke="#6B5E48" stroke-width="4"/>

<rect x="308" y="92" width="180" height="44" fill="#E8D9B0" stroke="#7A5A2E" stroke-width="1.5"/>
<text x="330" y="119" font-size="11" fill="#2A2A2A">shared hall (meals)</text>

<g stroke="#639922" stroke-width="1.5">
  <line x1="188" y1="180" x2="286" y2="180"/><line x1="188" y1="196" x2="286" y2="196"/>
  <line x1="188" y1="212" x2="286" y2="212"/><line x1="188" y1="228" x2="286" y2="228"/>
  <line x1="188" y1="244" x2="286" y2="244"/>
</g>
<text x="186" y="266" font-size="10" fill="#3B6D11">garden terraces</text>
<text x="186" y="280" font-size="10" fill="#3B6D11">(they feed themselves)</text>

<rect x="300" y="150" width="256" height="146" fill="#FBF8F2" stroke="#B9AE94"/>
<g stroke="#B4552D" stroke-width="1.5">
  <line x1="516" y1="184" x2="516" y2="262"/>
  <line x1="526" y1="184" x2="526" y2="262"/>
  <line x1="536" y1="184" x2="536" y2="262"/>
  <line x1="546" y1="184" x2="546" y2="262"/>
</g>
<text x="324" y="170" font-size="10" fill="#6B675E">LEVEL COURT</text>
<text x="496" y="278" font-size="9" fill="#B4552D">one broad stair</text>
<circle cx="420" cy="238" r="8" fill="none" stroke="#7FA0A8" stroke-width="2.5"/>
<text x="404" y="260" font-size="10" fill="#6B675E">well</text>

<g fill="#7A5A2E">
  <circle cx="310" cy="144" r="2.5"/><circle cx="346" cy="144" r="2.5"/><circle cx="382" cy="144" r="2.5"/><circle cx="418" cy="144" r="2.5"/><circle cx="454" cy="144" r="2.5"/><circle cx="490" cy="144" r="2.5"/><circle cx="526" cy="144" r="2.5"/>
  <circle cx="310" cy="302" r="2.5"/><circle cx="346" cy="302" r="2.5"/><circle cx="382" cy="302" r="2.5"/><circle cx="418" cy="302" r="2.5"/><circle cx="454" cy="302" r="2.5"/><circle cx="490" cy="302" r="2.5"/><circle cx="526" cy="302" r="2.5"/>
  <circle cx="294" cy="180" r="2.5"/><circle cx="294" cy="220" r="2.5"/><circle cx="294" cy="260" r="2.5"/>
</g>
<text x="352" y="316" font-size="10" fill="#555349">covered walkway — arch after arch</text>

<rect x="562" y="150" width="64" height="146" fill="#E8DFC9" stroke="#B4552D" stroke-width="2"/>
<text x="594" y="210" font-size="9" fill="#2A2A2A" text-anchor="middle">
  <tspan x="594" dy="0">CHAPEL</tspan>
  <tspan x="594" dy="13">PLATFORM</tspan>
  <tspan x="594" dy="13">(HIGH)</tspan>
</text>

<rect x="596" y="88" width="36" height="36" fill="none" stroke="#B4552D" stroke-width="2" stroke-dasharray="5 4"/>
<text x="614" y="76" font-size="9" fill="#555349" text-anchor="middle">licensed bell tower</text>

<rect x="308" y="322" width="236" height="24" fill="#E8D9B0" stroke="#7A5A2E" stroke-width="1.5"/>
<text x="426" y="338" font-size="10" fill="#555349" text-anchor="middle">shared dormitory (default)</text>

<rect x="164" y="210" width="12" height="44" fill="#FFFFFF" stroke="#6B5E48" stroke-width="1.5"/>
<text x="158" y="220" font-size="9" fill="#2A2A2A" text-anchor="end">
  <tspan x="158" dy="0">centered gate</tspan>
  <tspan x="158" dy="11">LOW end</tspan>
</text>

<path d="M 170 232 C 118 304 226 378 200 472" fill="none" stroke="#8A8377" stroke-width="7" opacity="0.6"/>
