  <text x="40" y="70" font-size="13.5" fill="#5d6470">STATUS: DRAFT — PENDING CODEX ADVERSARIAL REVIEW (2026-07-27 campaign). Every relation and number is PROPOSED; nothing here is ruled or clay-proved.</text>
