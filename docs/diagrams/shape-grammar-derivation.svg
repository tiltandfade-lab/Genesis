<svg viewBox="0 0 960 560" xmlns="http://www.w3.org/2000/svg" font-family="Menlo, Consolas, monospace">
  <rect x="0" y="0" width="960" height="560" fill="#f4f1ea"/>
  <text x="480" y="34" text-anchor="middle" font-size="17" fill="#2b2b2b" font-weight="bold">SHAPE GRAMMAR — one derivation, top to bottom refinement</text>

  <!-- Stage A: axiom -->
  <g>
    <rect x="30" y="70" width="150" height="150" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.5"/>
    <rect x="55" y="150" width="100" height="50" fill="#d9d2c4" stroke="#5a5a5a" stroke-width="2"/>
    <text x="105" y="240" text-anchor="middle" font-size="12" fill="#2b2b2b" font-weight="bold">AXIOM</text>
    <text x="105" y="256" text-anchor="middle" font-size="10" fill="#5a5a5a">the plot (from parcel)</text>
  </g>
  <g><path d="M 190 145 L 220 145" stroke="#b0543f" stroke-width="2" marker-end="url(#arr)"/>
    <text x="205" y="130" text-anchor="middle" font-size="8.5" fill="#b0543f">mass</text></g>

  <!-- Stage B: mass split into floors -->
  <g>
    <rect x="225" y="70" width="150" height="150" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.5"/>
    <rect x="250" y="95" width="100" height="105" fill="#e8e2d4" stroke="#5a5a5a" stroke-width="2"/>
    <line x1="250" y1="130" x2="350" y2="130" stroke="#5a5a5a" stroke-width="1.2"/>
    <line x1="250" y1="165" x2="350" y2="165" stroke="#5a5a5a" stroke-width="1.2"/>
    <text x="300" y="240" text-anchor="middle" font-size="12" fill="#2b2b2b" font-weight="bold">SPLIT: floors</text>
    <text x="300" y="256" text-anchor="middle" font-size="10" fill="#5a5a5a">mass -&gt; 3 storeys</text>
  </g>
  <g><path d="M 385 145 L 415 145" stroke="#b0543f" stroke-width="2" marker-end="url(#arr)"/>
    <text x="400" y="130" text-anchor="middle" font-size="8.5" fill="#b0543f">facade</text></g>

  <!-- Stage C: facade split into bays -->
  <g>
    <rect x="420" y="70" width="150" height="150" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.5"/>
    <rect x="445" y="95" width="100" height="105" fill="#e8e2d4" stroke="#5a5a5a" stroke-width="2"/>
    <line x1="445" y1="130" x2="545" y2="130" stroke="#5a5a5a" stroke-width="1.2"/>
    <line x1="445" y1="165" x2="545" y2="165" stroke="#5a5a5a" stroke-width="1.2"/>
    <line x1="478" y1="95" x2="478" y2="200" stroke="#9a927f" stroke-width="1" stroke-dasharray="3,2"/>
    <line x1="512" y1="95" x2="512" y2="200" stroke="#9a927f" stroke-width="1" stroke-dasharray="3,2"/>
    <text x="495" y="240" text-anchor="middle" font-size="12" fill="#2b2b2b" font-weight="bold">REPEAT: bays</text>
    <text x="495" y="256" text-anchor="middle" font-size="10" fill="#5a5a5a">each floor -&gt; N bays</text>
  </g>
  <g><path d="M 580 145 L 610 145" stroke="#b0543f" stroke-width="2" marker-end="url(#arr)"/>
    <text x="595" y="130" text-anchor="middle" font-size="8.5" fill="#b0543f">close</text></g>

  <!-- Stage D: terminals -->
  <g>
    <rect x="615" y="70" width="150" height="150" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.5"/>
    <!-- roof -->
    <path d="M 635 95 L 690 68 L 745 95 Z" fill="#c8bfae" stroke="#5a5a5a" stroke-width="2"/>
    <rect x="640" y="95" width="100" height="105" fill="#e8e2d4" stroke="#5a5a5a" stroke-width="2"/>
    <!-- windows rows -->
    <rect x="650" y="103" width="16" height="18" fill="#8fa8b8" stroke="#5a5a5a"/>
    <rect x="682" y="103" width="16" height="18" fill="#8fa8b8" stroke="#5a5a5a"/>
    <rect x="714" y="103" width="16" height="18" fill="#8fa8b8" stroke="#5a5a5a"/>
    <rect x="650" y="138" width="16" height="18" fill="#8fa8b8" stroke="#5a5a5a"/>
    <rect x="714" y="138" width="16" height="18" fill="#8fa8b8" stroke="#5a5a5a"/>
    <!-- door: program obligation -->
    <rect x="682" y="168" width="18" height="32" fill="#7a5f43" stroke="#5a5a5a"/>
    <text x="690" y="240" text-anchor="middle" font-size="12" fill="#2b2b2b" font-weight="bold">window | door | roof</text>
    <text x="690" y="256" text-anchor="middle" font-size="10" fill="#5a5a5a">exactly ONE door: a rule</text>
    <text x="690" y="270" text-anchor="middle" font-size="10" fill="#5a5a5a">can carry an obligation</text>
  </g>

  <!-- annotation panel right -->
  <g>
    <rect x="790" y="70" width="150" height="150" fill="#efe9db" stroke="#b0a890" stroke-width="1"/>
    <text x="865" y="92" text-anchor="middle" font-size="10" fill="#2b2b2b" font-weight="bold">every arrow =</text>
    <text x="865" y="106" text-anchor="middle" font-size="10" fill="#2b2b2b" font-weight="bold">a NAMED RULE</text>
    <text x="800" y="128" font-size="9.5" fill="#4a4a4a">- seeded choice picks</text>
    <text x="808" y="141" font-size="9.5" fill="#4a4a4a">among rule options</text>
    <text x="800" y="158" font-size="9.5" fill="#4a4a4a">- parameters set size,</text>
    <text x="808" y="171" font-size="9.5" fill="#4a4a4a">counts, proportions</text>
    <text x="800" y="188" font-size="9.5" fill="#4a4a4a">- deterministic replay:</text>
    <text x="808" y="201" font-size="9.5" fill="#4a4a4a">same seed, same building</text>
  </g>

  <!-- Row 2: same grammar, different seeds -->
  <text x="480" y="316" text-anchor="middle" font-size="15" fill="#2b2b2b" font-weight="bold">SAME GRAMMAR, THREE SEEDS — categorical variety from rule choices, not jitter</text>

  <!-- Seed 1: tower -->
  <g>
    <rect x="60" y="340" width="240" height="170" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.5"/>
    <rect x="145" y="365" width="60" height="120" fill="#e8e2d4" stroke="#5a5a5a" stroke-width="2"/>
    <line x1="145" y1="395" x2="205" y2="395" stroke="#5a5a5a"/>
    <line x1="145" y1="425" x2="205" y2="425" stroke="#5a5a5a"/>
    <line x1="145" y1="455" x2="205" y2="455" stroke="#5a5a5a"/>
    <rect x="140" y="355" width="70" height="10" fill="#c8bfae" stroke="#5a5a5a" stroke-width="1.5"/>
    <rect x="165" y="370" width="18" height="14" fill="#8fa8b8" stroke="#5a5a5a"/>
    <rect x="165" y="461" width="16" height="24" fill="#7a5f43" stroke="#5a5a5a"/>
    <text x="180" y="530" text-anchor="middle" font-size="11" fill="#2b2b2b">footprint: narrow · floors: 4</text>
    <text x="180" y="545" text-anchor="middle" font-size="11" fill="#2b2b2b">roof rule: parapet -&gt; LOOKOUT</text>
  </g>

  <!-- Seed 2: long hall -->
  <g>
    <rect x="360" y="340" width="240" height="170" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.5"/>
    <path d="M 385 400 L 480 372 L 575 400 Z" fill="#c8bfae" stroke="#5a5a5a" stroke-width="2"/>
    <rect x="390" y="400" width="180" height="85" fill="#e8e2d4" stroke="#5a5a5a" stroke-width="2"/>
    <rect x="405" y="415" width="18" height="20" fill="#8fa8b8" stroke="#5a5a5a"/>
    <rect x="445" y="415" width="18" height="20" fill="#8fa8b8" stroke="#5a5a5a"/>
    <rect x="530" y="415" width="18" height="20" fill="#8fa8b8" stroke="#5a5a5a"/>
    <rect x="483" y="450" width="20" height="35" fill="#7a5f43" stroke="#5a5a5a"/>
    <text x="480" y="530" text-anchor="middle" font-size="11" fill="#2b2b2b">footprint: long · floors: 1</text>
    <text x="480" y="545" text-anchor="middle" font-size="11" fill="#2b2b2b">roof rule: gable -&gt; HALL</text>
  </g>

  <!-- Seed 3: L compound -->
  <g>
    <rect x="660" y="340" width="240" height="170" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.5"/>
    <rect x="685" y="430" width="130" height="55" fill="#e8e2d4" stroke="#5a5a5a" stroke-width="2"/>
    <rect x="770" y="375" width="60" height="110" fill="#e8e2d4" stroke="#5a5a5a" stroke-width="2"/>
    <line x1="770" y1="430" x2="830" y2="430" stroke="#5a5a5a"/>
    <rect x="765" y="366" width="70" height="9" fill="#c8bfae" stroke="#5a5a5a" stroke-width="1.5"/>
    <rect x="700" y="443" width="16" height="18" fill="#8fa8b8" stroke="#5a5a5a"/>
    <rect x="730" y="443" width="16" height="18" fill="#8fa8b8" stroke="#5a5a5a"/>
    <rect x="790" y="385" width="16" height="14" fill="#8fa8b8" stroke="#5a5a5a"/>
    <rect x="742" y="455" width="18" height="30" fill="#7a5f43" stroke="#5a5a5a"/>
    <text x="780" y="530" text-anchor="middle" font-size="11" fill="#2b2b2b">mass rule: L-split -&gt; wing + tower</text>
    <text x="780" y="545" text-anchor="middle" font-size="11" fill="#2b2b2b">COMPOUND from the same rules</text>
  </g>

  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b0543f"/>
    </marker>
  </defs>
</svg>
