<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620">
  <rect width="960" height="620" fill="#f4f0e7"/>
  <style>
    .label { font: 18px Arial, sans-serif; fill: #292822; }
    .small { font: 14px Arial, sans-serif; fill: #4d4b42; }
    .street { fill: #d7d1c3; stroke: #777267; stroke-width: 3; }
    .front { fill: #d8c49a; stroke: #705f40; stroke-width: 3; }
    .hall { fill: #ba8550; stroke: #6f4022; stroke-width: 4; }
    .service { fill: #cbd8bc; stroke: #58704a; stroke-width: 3; stroke-dasharray: 10 7; }
    .deck { fill: none; stroke: #376f86; stroke-width: 7; }
    .route { fill: none; stroke: #ffffff; stroke-width: 5; stroke-dasharray: 16 10; }
  </style>
  <text x="38" y="38" class="label">Urban market-hall Golden Seed — binding topology</text>
  <rect x="25" y="190" width="910" height="250" rx="20" class="street"/>
  <text x="38" y="180" class="small">arrival street end</text>
  <text x="790" y="180" class="small">departure street end</text>

  <rect x="190" y="70" width="580" height="100" class="front"/>
  <text x="382" y="125" class="label">owned frontage run</text>
  <g stroke="#705f40" stroke-width="2">
    <line x1="285" y1="70" x2="285" y2="170"/>
    <line x1="390" y1="70" x2="390" y2="170"/>
    <line x1="505" y1="70" x2="505" y2="170"/>
    <line x1="625" y1="70" x2="625" y2="170"/>
  </g>

  <rect x="170" y="465" width="620" height="100" class="front"/>
  <text x="382" y="522" class="label">owned frontage run</text>
  <g stroke="#705f40" stroke-width="2">
    <line x1="275" y1="465" x2="275" y2="565"/>
    <line x1="390" y1="465" x2="390" y2="565"/>
    <line x1="510" y1="465" x2="510" y2="565"/>
    <line x1="635" y1="465" x2="635" y2="565"/>
  </g>

  <rect x="392" y="230" width="235" height="165" rx="8" class="hall"/>
  <text x="436" y="305" class="label">open-post</text>
  <text x="442" y="330" class="label">market hall</text>
  <circle cx="655" cy="312" r="42" fill="#9fc6ce" stroke="#376f86" stroke-width="4"/>
  <text x="629" y="318" class="small">fountain</text>

  <path d="M45 270 H365 Q385 270 385 250 V225" class="route"/>
  <path d="M45 365 H365 Q385 365 385 390 V415 H915" class="route"/>
  <path d="M635 225 V215 Q635 205 650 205 H915" class="route"/>
  <text x="255" y="252" class="small">street route A</text>
  <text x="250" y="410" class="small">street route B</text>

  <rect x="790" y="465" width="145" height="100" class="service"/>
  <text x="804" y="505" class="small">delivery /</text>
  <text x="804" y="526" class="small">water / waste</text>

  <path d="M205 85 H755" class="deck"/>
  <text x="344" y="62" class="small">connected gallery / urban deck</text>
  <path d="M740 170 l55 55" fill="none" stroke="#376f86" stroke-width="10"/>
  <text x="746" y="245" class="small">outside stair</text>

  <text x="400" y="452" class="small">plaza / market apron remains open</text>
</svg>
