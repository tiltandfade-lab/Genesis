name: CI

# Genesis validation gates (docs/NEXT-STEPS.md "Wire CI" item): manifest consistency,
# every headless-capable dev/verify-*.mjs harness, and the running playtest-bug-probes
# regression list.
#
# Runs on pushes to master + every pull_request ONLY — NOT on every branch push. A blanket
# `on: push` (all branches) meant a single `git push --all` of ~100 backup/worktree branches
# fired ~100 failing CI runs and flooded the inbox (2026-07-13). Feature branches get their CI
# coverage via their pull_request; direct branch backups no longer trigger a run.

on:
  push:
    branches: [master]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 = full history. Two harnesses (verify-bw2-0-crisp-channel,
      # verify-bw2-2-floor-contact) do `git show <old-commit>:file` to compare against
      # historical revisions; the default shallow (depth-1) checkout omits those commits
      # and the git show throws. Full history is what the harnesses assume.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # As of the 2026-07-18 Git LFS migration, all binaries are LFS-tracked. We do NOT set
      # `lfs: true` on checkout: that auto-pulls the full ~6 GB sprite/asset corpus every run
      # and would exhaust the 10 GiB/mo free LFS bandwidth in a couple of runs. Only
      # verify-bw2-3-material-texel actually decodes real PNG bytes (reads IHDR width/height
      # of assets/textures/*.png); pull just that small set (~3.7 MB). All other harnesses use
      # os.path.exists / path strings / text data files, which the checked-out LFS pointer
      # stubs satisfy fine. Add more `--include` globs here if a harness starts decoding
      # other real asset bytes.
      - name: Materialize LFS textures (bw2-3 reads real PNG IHDR)
        run: git lfs pull --include="assets/textures/**"
        shell: bash

      # No npm cache: the only lock file (dev/jsdom-home/package-lock.json) is gitignored,
      # and setup-node hard-fails when cache-dependency-path doesn't exist at checkout.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # jsdom lives OUTSIDE the repo checkout (Genesis has no package.json at the root —
      # it's classic <script> modules sharing global scope, not an npm project). The
      # verify-*.mjs harnesses already know this convention: they resolve jsdom via
      # createRequire(JSDOM_HOME/package.json) with JSDOM_HOME defaulting to
      # ~/.genesis-jsdom (see CLAUDE.md "headless test"). In CI we point JSDOM_HOME at a
      # throwaway install dir instead of touching the repo tree. No other package (e.g.
      # `three`) is actually imported by any verify-*.mjs — every "three"/"THREE" mention
      # in those files is either the English word or a hand-rolled stub, confirmed by
      # grepping every harness's real import/require lines before writing this workflow.
      - name: Install jsdom (scratch dir, not the repo)
        run: |
          mkdir -p dev/jsdom-home
          cd dev/jsdom-home
          [ -f package.json ] || npm init -y
          npm install jsdom --no-audit --no-fund
        shell: bash

      - name: check-manifest.py (module index / drift gate)
        run: python3 build/check-manifest.py

      # Every dev/verify-*.mjs that can run headless, in one pass. JSDOM_HOME points at
      # the scratch install above. Every file's real import/require lines were grepped
      # before writing this workflow (not just header comments) to confirm what each one
      # actually needs. Only one is excluded:
      #   - dev/verify-sprite-pipeline.py — a build/ pipeline self-test for
      #     build/slice-sprites.py, requires Pillow, and its OWN docstring says "Not wired
      #     into check-manifest.py (this is a build/ pipeline test, not an app-module
      #     test) — run it by hand after touching build/slice-sprites.py." Excluded on the
      #     same basis its author documented; run it by hand when touching that pipeline.
      # Everything else runs here, including two plain-Python harnesses that proved fast
      # and dependency-free (verify-bridge.py: spawns its own dev/dm-bridge.py on an
      # OS-assigned ephemeral port, 127.0.0.1 only, no network egress, self-cleans;
      # verify-table-lint.py: builds synthetic fixtures in a temp dir, no deps).
      - name: verify-*.mjs harnesses
        env:
          JSDOM_HOME: ${{ github.workspace }}/dev/jsdom-home
          # Seed Math.random deterministically (dev/ci-seed-rng.cjs). ~10 harnesses sample N rolls and
          # assert a distribution within a tight tolerance; on unseeded RNG each flakes ~2-3% and the
          # suite trips ~20-30% of runs for no real reason. This shim is CI/Node-test-only — the game
          # runs in a browser and never loads it, so real entropy in play is untouched. See the file header.
          NODE_OPTIONS: --require ${{ github.workspace }}/dev/ci-seed-rng.cjs
        run: |
          fail=0
          # Some harnesses need a render/paint toolchain CI deliberately does not install: puppeteer-core
          # + a real headless Chromium (GL render harnesses), or Pillow/PIL (the gallery-paintings
          # generator, which is also non-deterministic — its own byte-identical check is flaky, so it must
          # not gate CI). Rather than hand-maintain an exclusion list (which silently rots the moment a new
          # such harness lands — the failure mode that let CI pile up red), this loop is DEPENDENCY-AWARE:
          # a harness that fails *specifically* because one of those deps is missing counts as SKIP, not
          # FAIL. A harness that fails for any other reason still fails CI. Same spirit as the
          # verify-sprite-pipeline.py exclusion above — render/paint checks run by hand locally; headless
          # module tests run here.
          for f in dev/verify-*.mjs; do
            echo "::group::node $f"
            if out=$(node "$f" 2>&1); then
              echo "$out"
            else
              echo "$out"
              # DEP-MISSING signatures = SKIP, not FAIL (see the dep-aware note above). Each is a
              # SPECIFIC "this dependency isn't installed in CI" message a harness emits deliberately,
              # never a generic error — so this can't mask a real failure. puppeteer-core/PIL =
              # render/paint tools; "fast-check not resolvable under GEOMETRY_TOOLS_HOME" = the
              # geometry-tools fuzz kit (dev/geometry-tools/setup.mjs), the same by-hand-locally posture.
              if echo "$out" | grep -qE "puppeteer-core|No module named 'PIL'|fast-check not resolvable"; then
                echo "SKIP (dep unavailable in CI — render/paint/geometry-tools): $f"
              else
                echo "FAILED: $f"
                fail=1
              fi
            fi
            echo "::endgroup::"
          done
          exit $fail

      - name: verify-bridge.py (DM bridge transport + contract)
        run: python3 dev/verify-bridge.py

      - name: verify-table-lint.py (table linter self-test)
        run: python3 dev/verify-table-lint.py

      # W3 stale-artifact guard (docs/DESIGN.md 2026-07-27): tables.json/tables.js are committed
      # but GENERATED — this recompiles the real Engine table source into a throwaway temp dir
      # (never touching the real committed files) and fails if the fresh output isn't
      # byte-identical to what's committed, catching the "authored tables, forgot to recompile"
      # class of bug check-manifest/table-lint can't see. Stdlib-only, no jsdom/deps needed.
      - name: verify-compile-fresh.py (tables.json/tables.js staleness gate)
        run: python3 dev/verify-compile-fresh.py

      - name: playtest-bug-probes.mjs (running regression list)
        env:
          JSDOM_HOME: ${{ github.workspace }}/dev/jsdom-home
          NODE_OPTIONS: --require ${{ github.workspace }}/dev/ci-seed-rng.cjs
        run: node dev/playtest-bug-probes.mjs
