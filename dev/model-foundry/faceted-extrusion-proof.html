<header><h1>Ornate Fantasy shield · matched extrusion comparison</h1><p>A is the failed legacy slab. B preserves the original art on the new mesh. C uses regenerated mature faceted art on the exact same mesh recipe.</p></header>

<script type="module">
import * as THREE from "/vendor/three/three.module.js";
import {GLTFLoader} from "/vendor/three/addons/loaders/GLTFLoader.js";
const renderer=new THREE.WebGLRenderer({canvas:document.querySelector('#stage'),antialias:true,preserveDrawingBuffer:true});
renderer.setSize(480,364,false);renderer.setPixelRatio(1);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.shadowMap.enabled=true;
const loader=new GLTFLoader(),load=url=>new Promise((resolve,reject)=>loader.load(url,resolve,undefined,reject));
function buildView(gltf,view){
 const scene=new THREE.Scene();scene.background=new THREE.Color(0x232127);
 scene.add(new THREE.HemisphereLight(0xffedcf,0x26313e,1.15));
 const key=new THREE.DirectionalLight(0xffd6a6,3.4);key.position.set(view==='reverse-light'?3:-3,5,4);scene.add(key);
 const rim=new THREE.DirectionalLight(0x7aa9d8,1.35);rim.position.set(4,2,-3);scene.add(rim);
 const group=gltf.scene,box=new THREE.Box3().setFromObject(group),center=box.getCenter(new THREE.Vector3()),size=box.getSize(new THREE.Vector3());
 group.position.sub(center);group.position.y+=size.y/2;scene.add(group);
 const wall=new THREE.Mesh(new THREE.BoxGeometry(2.5,1.8,.12),new THREE.MeshStandardMaterial({color:0x474148,roughness:.95,flatShading:true}));wall.position.set(0,.72,-.24);scene.add(wall);
 const floor=new THREE.Mesh(new THREE.PlaneGeometry(3,3),new THREE.MeshStandardMaterial({color:0x353238,roughness:1}));floor.rotation.x=-Math.PI/2;scene.add(floor);
 if(view==='topology-diagnostic'){group.traverse(object=>{if(!object.isMesh)return;const lines=new THREE.LineSegments(new THREE.WireframeGeometry(object.geometry),new THREE.LineBasicMaterial({color:0xf1c66d,transparent:true,opacity:.86,depthTest:false}));lines.renderOrder=20;object.add(lines)})}
 const max=Math.max(size.x,size.y,.01),cam=new THREE.OrthographicCamera(-1,1,.76,-.76,.01,100);
 const cameraVector=view==='grazing-side'?new THREE.Vector3(4.8,1.7,1.05):view==='topology-diagnostic'?new THREE.Vector3(1.6,1.6,4.4):new THREE.Vector3(2.5,2.0,3.8);
 cam.position.copy(cameraVector.normalize().multiplyScalar(max*3.2));cam.lookAt(0,size.y*.48,0);cam.zoom=1.08/max;cam.updateProjectionMatrix();
 return {scene,cam};
}
window.renderComparison=async report=>{const grid=document.querySelector('#grid');grid.textContent='';
 for(const view of report.views){for(const variant of report.variants){const v=buildView(await load('/'+variant.output),view);renderer.render(v.scene,v.cam);const cell=document.createElement('div');cell.className='cell';const image=document.createElement('img');image.src=renderer.domElement.toDataURL('image/png');const label=document.createElement('div');label.className='label';label.innerHTML=`${variant.label}<small>${view} · ${variant.faces||'legacy'} faces · ${variant.knownVerdict}</small>`;cell.append(image,label);grid.append(cell)}}
 await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));window.__rendered=true;};window.__ready=true;
