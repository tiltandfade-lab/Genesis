<svg viewBox="0 0 760 470" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dt dd" font-family="ui-sans-serif, -apple-system, 'Segoe UI', sans-serif">
<title id="dt">The camp's deck — elevation view of the Q4 ruling (RULED 2026-07-24)</title>
<desc id="dd">Side elevation showing the vertical quantum ladder from 0h to 4h, a terrain knoll climbing to 3h by free steps, a wagon whose top sits at 2h reached by climb-cost, and the occupancy-licensed lashed watch platform with its deck at 4h, climb-cost access up the lashed frame, a rail granting cover, and catch points for grapples.</desc>
<rect x="0" y="0" width="760" height="470" fill="#FFFFFF"/>

<text x="16" y="24" font-size="13" font-weight="700" fill="#2A2A2A">The camp's deck — elevation (RULED 2026-07-24)</text>
<text x="16" y="41" font-size="11" fill="#6B675E">terrain owns the high ground · wagon top always climbable · platform only by occupancy license</text>

<line x1="30" y1="390" x2="740" y2="390" stroke="#555349" stroke-width="2"/>

<!-- height ladder -->
<g font-size="10" fill="#6B675E">
  <line x1="52" y1="390" x2="52" y2="170" stroke="#8A8377" stroke-width="1"/>
  <g stroke="#8A8377" stroke-width="1">
    <line x1="46" y1="390" x2="58" y2="390"/><line x1="46" y1="335" x2="58" y2="335"/>
    <line x1="46" y1="280" x2="58" y2="280"/><line x1="46" y1="225" x2="58" y2="225"/>
    <line x1="46" y1="170" x2="58" y2="170"/>
  </g>
  <text x="14" y="394">0h</text><text x="14" y="339">1h</text><text x="14" y="284">2h</text>
  <text x="14" y="229">3h</text><text x="14" y="174">4h</text>
  <text x="62" y="174">10 ft</text><text x="62" y="284">5 ft</text>
</g>
<line x1="58" y1="280" x2="470" y2="280" stroke="#C9C5B9" stroke-width="1" stroke-dasharray="5 6"/>
<line x1="58" y1="170" x2="540" y2="170" stroke="#C9C5B9" stroke-width="1" stroke-dasharray="5 6"/>

<!-- knoll: free steps to 3h -->
<path d="M 96 390 L 138 390 L 138 335 L 178 335 L 178 280 L 216 280 L 216 225 L 272 225 L 280 390 Z"
      fill="#C0DD97" stroke="#3B6D11" stroke-width="1.5"/>
<text x="100" y="212" font-size="11" font-weight="700" fill="#2A2A2A">knoll — terrain's deck (3h)</text>
<text x="100" y="316" font-size="10" fill="#3B6D11" transform="rotate(-52 100 316)">walk: steps ≤1h free</text>

<!-- scale figure (6 ft) -->
<g stroke="#555349" stroke-width="2" fill="none">
  <circle cx="316" cy="266" r="9"/>
  <line x1="316" y1="275" x2="316" y2="342"/>
  <line x1="316" y1="342" x2="306" y2="390"/><line x1="316" y1="342" x2="326" y2="390"/>
  <line x1="303" y1="300" x2="329" y2="300"/>
</g>
<text x="296" y="410" font-size="10" fill="#6B675E">6 ft</text>

<!-- wagon -->
<circle cx="392" cy="362" r="26" fill="none" stroke="#7A5A2E" stroke-width="2.5"/>
<circle cx="474" cy="362" r="26" fill="none" stroke="#7A5A2E" stroke-width="2.5"/>
<rect x="360" y="308" width="150" height="34" fill="#C89A5B" stroke="#7A5A2E" stroke-width="1.5"/>
<rect x="372" y="280" width="118" height="28" fill="#E8D9B0" stroke="#7A5A2E" stroke-width="1.5"/>
<line x1="366" y1="280" x2="498" y2="280" stroke="#B4552D" stroke-width="2.5"/>
<text x="356" y="268" font-size="11" font-weight="700" fill="#2A2A2A">wagon top ≈ 2h</text>
<text x="500" y="300" font-size="10" fill="#555349">climb-cost: ×2 move, no roll</text>

<!-- lashed watch platform -->
<g stroke="#7A5A2E" stroke-width="4" fill="none">
  <line x1="576" y1="390" x2="586" y2="168"/>
  <line x1="706" y1="390" x2="696" y2="168"/>
</g>
<g stroke="#7A5A2E" stroke-width="2" fill="none">
  <line x1="580" y1="330" x2="702" y2="238"/>
  <line x1="700" y1="330" x2="582" y2="238"/>
</g>
<rect x="566" y="160" width="150" height="9" fill="#C89A5B" stroke="#7A5A2E" stroke-width="1.5"/>
<g stroke="#7A5A2E" stroke-width="2.5" fill="none">
  <line x1="572" y1="160" x2="576" y2="112"/>
  <line x1="710" y1="160" x2="706" y2="112"/>
  <line x1="576" y1="112" x2="706" y2="112"/>
</g>
<g stroke="#B4552D" stroke-width="2" fill="none">
  <path d="M 578 166 l 12 8 m -12 0 l 12 -8"/>
  <path d="M 694 166 l 12 8 m -12 0 l 12 -8"/>
  <path d="M 634 280 l 12 8 m -12 0 l 12 -8"/>
  <path d="M 572 116 l 10 7 m -10 0 l 10 -7"/>
  <path d="M 700 116 l 10 7 m -10 0 l 10 -7"/>
</g>
<circle cx="576" cy="112" r="6" fill="none" stroke="#B4552D" stroke-width="2"/>
<circle cx="706" cy="112" r="6" fill="none" stroke="#B4552D" stroke-width="2"/>
<text x="540" y="92" font-size="10" fill="#555349">catch points (grapple targets)</text>
<g stroke="#B4552D" stroke-width="1.5" fill="none">
  <path d="M 560 384 Q 552 300 570 190"/>
  <path d="M 564 198 L 570 186 L 576 198"/>
</g>
<text x="426" y="352" font-size="10" fill="#555349">climb the lashed frame:</text>
<text x="426" y="365" font-size="10" fill="#555349">climb-cost (×2 move, no roll)</text>

<text x="560" y="140" font-size="11" font-weight="700" fill="#2A2A2A">deck at 4h = 10 ft</text>
<text x="600" y="128" font-size="10" fill="#555349">rail = cover at the deck edge</text>

<rect x="548" y="52" width="196" height="22" rx="11" fill="#F4EDE2" stroke="#B4552D" stroke-width="1.5"/>
<text x="560" y="67" font-size="11" fill="#2A2A2A">licensed: military · bandit only</text>

<text x="16" y="452" font-size="10" fill="#6B675E">h = 2.5 ft (the locked vertical quantum) · rail cover class set at card time · no ladder mechanics needed — the frame itself is the route</text>
</svg>
