  <desc>STATUS: DRAFT — PENDING CODEX ADVERSARIAL REVIEW (2026-07-27 campaign). Companion to docs/SITE-9-CONTESTED-FORTRESS-SPEC.md. Self-contained: no external references, explicit fills only.</desc>

