<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 760" font-family="Helvetica, Arial, sans-serif">
  <rect width="1080" height="760" fill="#14141a"/>
  <text x="24" y="36" fill="#f0f0f0" font-size="22" font-weight="bold">Genesis adoption matrix — visible return vs ongoing solo labor</text>
  <text x="24" y="58" fill="#9a9aa8" font-size="13">Position = judgment from the study's documented costs + measured gaps. Color = bucket. Research only; every placement is PROPOSED.</text>

  <!-- axes -->
  <g stroke="#5a5a6a" stroke-width="2">
    <line x1="120" y1="640" x2="1020" y2="640"/>
    <line x1="120" y1="640" x2="120" y2="90"/>
  </g>
  <text x="560" y="680" fill="#c8c8d4" font-size="14" text-anchor="middle">ongoing labor for a solo owner →</text>
  <text x="60" y="360" fill="#c8c8d4" font-size="14" transform="rotate(-90 60 360)" text-anchor="middle">visible world-beauty return →</text>

  <!-- quadrant shading -->
  <rect x="120" y="90" width="450" height="275" fill="#1e2a1e"/>
  <rect x="570" y="90" width="450" height="275" fill="#2a261e"/>
  <rect x="120" y="365" width="450" height="275" fill="#20222a"/>
  <rect x="570" y="365" width="450" height="275" fill="#2a1e1e"/>
  <text x="130" y="106" fill="#7ab87a" font-size="12" font-weight="bold">DO FIRST (high return, low labor)</text>
  <text x="580" y="106" fill="#c8a860" font-size="12" font-weight="bold">STAGE CAREFULLY (high return, high labor)</text>
  <text x="130" y="381" fill="#8090a8" font-size="12" font-weight="bold">HYGIENE (modest return, cheap)</text>
  <text x="580" y="381" fill="#c87a7a" font-size="12" font-weight="bold">DECLINE (return not worth the bill)</text>

  <!-- items: MUST HAVE / built (green), HIGH LEVERAGE (yellow-green), EXPENSIVE/LATER (amber), DECLINE (red) -->
  <g font-size="12">
    <!-- DO FIRST -->
    <circle cx="205" cy="150" r="9" fill="#68c068"/><text x="220" y="154" fill="#d8ecd8">materials-to-production pass (sprite-first parents + realm ramps)</text>
    <circle cx="185" cy="195" r="9" fill="#68c068"/><text x="200" y="199" fill="#d8ecd8">value-ceiling + grade discipline (claim p98 highlights; grayscale gate)</text>
    <circle cx="230" cy="240" r="9" fill="#a8c860"/><text x="245" y="244" fill="#e4ecd0">context Band 1+3: portal/support apron + far plate family</text>
    <circle cx="170" cy="285" r="9" fill="#a8c860"/><text x="185" y="289" fill="#e4ecd0">mutation channels 1–3 (decal · attachment · instance override)</text>
    <circle cx="150" cy="330" r="9" fill="#68c068"/><text x="165" y="334" fill="#d8ecd8">keep: fixed camera · omission · post suite · lit standees (built)</text>

    <!-- STAGE CAREFULLY -->
    <circle cx="640" cy="150" r="9" fill="#a8c860"/><text x="655" y="154" fill="#e4ecd0">composition compiler C1H (masses/spine/connectors/quiet ground)</text>
    <circle cx="700" cy="215" r="9" fill="#d8a850"/><text x="715" y="219" fill="#f0e0c0">trim + culture material breadth (per-family variants)</text>
    <circle cx="760" cy="270" r="9" fill="#d8a850"/><text x="775" y="274" fill="#f0e0c0">structural-state families (channel 4: crack→brace→fail)</text>
    <circle cx="820" cy="320" r="9" fill="#d8a850"/><text x="835" y="324" fill="#f0e0c0">context Band 2 mid-field fabric · sprite normal-map trial</text>

    <!-- HYGIENE -->
    <circle cx="180" cy="440" r="9" fill="#8098b8"/><text x="195" y="444" fill="#d0d8e8">capture-ritual tests (thumbnail/grayscale/post-off) as standing gates</text>
    <circle cx="220" cy="500" r="9" fill="#8098b8"/><text x="235" y="504" fill="#d0d8e8">palette handshake build script (terrain ramps from realm JSONs)</text>
    <circle cx="160" cy="560" r="9" fill="#8098b8"/><text x="175" y="564" fill="#d0d8e8">ledger/provenance upkeep (plates, receipts, source refs)</text>

    <!-- DECLINE -->
    <circle cx="640" cy="440" r="9" fill="#d05858"/><text x="655" y="444" fill="#f0cccc">free camera rotation (Arai: "a lot of resources… all sides")</text>
    <circle cx="700" cy="490" r="9" fill="#d05858"/><text x="715" y="494" fill="#f0cccc">multi-facing sprite sets (TS rationed to 4 characters)</text>
    <circle cx="760" cy="540" r="9" fill="#d05858"/><text x="775" y="544" fill="#f0cccc">cast-wide frame animation (pose × cast multiplication)</text>
    <circle cx="820" cy="590" r="9" fill="#d05858"/><text x="835" y="594" fill="#f0cccc">bespoke per-map texture passes · one-off scripted set-pieces</text>
    <circle cx="600" cy="615" r="9" fill="#d05858"/><text x="615" y="619" fill="#f0cccc">photoreal-reduced environments (rejected by HD-2D's own authors)</text>
  </g>

  <!-- legend -->
  <g font-size="12" fill="#c8c8d4">
    <circle cx="140" cy="712" r="7" fill="#68c068"/><text x="154" y="716">built / ruled — keep investing</text>
    <circle cx="360" cy="712" r="7" fill="#a8c860"/><text x="374" y="716">high leverage next</text>
    <circle cx="530" cy="712" r="7" fill="#d8a850"/><text x="544" y="716">expensive / later</text>
    <circle cx="700" cy="712" r="7" fill="#d05858"/><text x="714" y="716">declined with documented reason</text>
  </g>
  <text x="24" y="748" fill="#6a6a78" font-size="11">Original diagram derived from lane-8 evidence. Research only — adoption/decline is Adam's to rule.</text>
</svg>
