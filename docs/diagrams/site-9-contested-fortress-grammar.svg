  <!-- PANEL A legend -->
  <g font-size="12" fill="#3a3f48">
    <text x="40" y="500" font-size="12.5" font-weight="700" fill="#20242b">1</text><text x="56" y="500">OUTSIDE FIELD — ditch / glacis / slope. Quiet ground: sparse cover, fully exposed, and the largest single region.</text>
    <text x="40" y="520" font-size="12.5" font-weight="700" fill="#20242b">2</text><text x="56" y="520">WALL-WALK — the site's signature deck. A <tspan font-style="italic">route</tspan>, not a position: ≥ 2 access points, ≥ 1 chokepoint, ≥ 10 ft clear.</text>
    <text x="40" y="540" font-size="12.5" font-weight="700" fill="#b5442e">3</text><text x="56" y="540" fill="#8a3524">CHOKEPOINT — the tower's two walk doors, one cell wide. The highest-value square on the board.</text>
    <text x="40" y="560" font-size="12.5" font-weight="700" fill="#20242b">4</text><text x="56" y="560">STAIR HEAD — the walk's access from the court, and its own defensible cap.</text>
    <text x="40" y="580" font-size="12.5" font-weight="700" fill="#20242b">5</text><text x="56" y="580">INSIDE COURT — 30–35 ft below the walk. Structures line the enceinte; the centre stays open.</text>
    <text x="40" y="600" font-size="12.5" font-weight="700" fill="#20242b">6</text><text x="56" y="600">ATTRIBUTED GROUND — named, contiguous, camera-readable. Narration alone does not satisfy the invariant.</text>
    <text x="40" y="620" font-size="12.5" font-weight="700" fill="#b5442e">7</text><text x="56" y="620" fill="#8a3524">THE LINE — readable at the production camera without the receipt. Crossing has a stated cost, and the line can move.</text>
    <text x="40" y="640" font-size="12.5" font-weight="700" fill="#2f5c8f">8</text><text x="56" y="640" fill="#2f5c8f">ALTERNATE CROSSING — postern / breach / mural passage / ladder point. Capacity 1, no cargo. Committed before observation.</text>
    <text x="40" y="660" font-size="12.5" font-weight="700" fill="#20242b">9</text><text x="56" y="660">PRECOMMITTED FRONTIER — the wall continues into unmaterialised fortress. A run ending in a flat cap is a rejection.</text>
  </g>

