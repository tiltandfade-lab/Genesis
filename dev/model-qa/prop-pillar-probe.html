<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Prop Probe — stone verticals + brazier (whole-object set pieces)</title>
<!-- dev/model-qa/prop-pillar-probe.html — renders all THREE prop-pillar.js exports side by side in
     one geometry frame (each builder takes an x-offset). Serve over localhost, PORT 5265. -->
<style>
  html,body{margin:0;background:#171310;color:#cbbfa8;font:13px/1.4 ui-monospace,Menlo,monospace}
  #bar{display:flex;gap:14px;align-items:center;padding:8px 12px;border-bottom:1px solid #2c241b}
  #bar b{color:#e8d9b0;font-weight:600}
  button{background:#33291d;color:#e8d9b0;border:1px solid #4a3b28;border-radius:4px;padding:4px 10px;cursor:pointer}
  #stage{display:block;width:100%;max-width:1280px;margin:0 auto}
</style>
</head>
<body>
<div id="bar"><b>PROP PROBE — pillar / broken / brazier</b><span id="stat">booting…</span><button id="save">Save PNG</button></div>
<canvas id="stage" width="1280" height="820"></canvas>
<script type="module">
import { resetGeom, mountSheet } from './probe-lib.js';
import { buildPillar, buildPillarBroken, buildBrazier } from './creatures/prop-pillar.js';
resetGeom();
buildPillar(-1.35);
buildPillarBroken(0.0);
buildBrazier(1.35);
mountSheet(
  document.getElementById('stage'), document.getElementById('stat'), document.getElementById('save'),
  'prop-pillar.js — intact · broken · brazier (side by side, one frame)',
  {name:'prop-pillar-probe'}
);
</script>
</body>
</html>
