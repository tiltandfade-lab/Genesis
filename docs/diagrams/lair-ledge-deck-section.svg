<svg viewBox="0 0 760 510" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="lt ld" font-family="ui-sans-serif, -apple-system, 'Segoe UI', sans-serif">
<title id="lt">The lair's deck — chamber section and room graph (site 7 thin brief, 2026-07-24)</title>
<desc id="ld">Current Golden-seed cross-section of a lair chamber: mouth daylight ends at a hard boundary, the floor holds the nest and water, and a broken ledge sits at 3h on the far wall with rimrock cover, a jump gap, a climb face below it, a rubble-ramp walk route behind, and an upper tunnel feeding it as a flanking loop. The complete overhead shell exists as a world fact but is omitted by the fixed-camera cutaway.</desc>
<rect x="0" y="0" width="760" height="510" fill="#FFFFFF"/>

<text x="14" y="20" font-size="13" font-weight="700" fill="#2A2A2A">The lair's deck — the ledge (chamber section)</text>

<!-- rock mass -->
<path d="M 40 410 L 40 150 Q 200 70 420 78 Q 640 86 745 140 L 745 410 Z"
      fill="#C9BCA4" stroke="#8A7A5E" stroke-width="1.5"/>

<!-- cavity -->
<path d="M 60 400 L 60 335 Q 100 318 140 296 Q 210 185 380 152 Q 520 182 630 190 L 740 190 L 740 232 L 700 233 L 560 235 L 560 400 Z"
      fill="#FBF8F2" stroke="#6B5E48" stroke-width="2"/>

<!-- mouth daylight: hard presentation boundary, no invented fixture -->
<path d="M 60 335 L 60 400 L 150 400 L 150 335 Z" fill="#FFF3D6"/>
<line x1="150" y1="335" x2="150" y2="400" stroke="#D4A84F" stroke-width="2"/>
<text x="52" y="282" font-size="10" fill="#555349">mouth daylight:</text>
<text x="52" y="296" font-size="10" fill="#555349">hard boundary</text>

<!-- height ladder -->
<g font-size="10" fill="#6B675E">
  <g stroke="#8A8377" stroke-width="1">
    <line x1="30" y1="400" x2="40" y2="400"/><line x1="30" y1="345" x2="40" y2="345"/>
    <line x1="30" y1="290" x2="40" y2="290"/><line x1="30" y1="235" x2="40" y2="235"/>
  </g>
  <text x="8" y="404">0h</text><text x="8" y="349">1h</text><text x="8" y="294">2h</text><text x="8" y="239">3h</text>
</g>
<line x1="40" y1="235" x2="560" y2="235" stroke="#C9C5B9" stroke-width="1" stroke-dasharray="5 6"/>

<!-- player + carried light -->
<circle cx="165" cy="352" r="66" fill="none" stroke="#B4552D" stroke-width="1.5" stroke-dasharray="4 5"/>
<g stroke="#555349" stroke-width="2" fill="none">
  <circle cx="165" cy="330" r="7"/>
  <line x1="165" y1="337" x2="165" y2="372"/>
  <line x1="165" y1="372" x2="158" y2="400"/><line x1="165" y1="372" x2="172" y2="400"/>
</g>
<text x="96" y="432" font-size="10" fill="#555349">carried light — Diablo-1 radius</text>

<!-- nest + bones -->
<ellipse cx="390" cy="392" rx="70" ry="12" fill="#EFE7D5" stroke="#B9AE94"/>
<g stroke="#8A8377" stroke-width="1.5">
  <line x1="360" y1="390" x2="376" y2="386"/><line x1="398" y1="394" x2="416" y2="390"/><line x1="382" y1="398" x2="394" y2="399"/>
</g>
<text x="352" y="376" font-size="10" fill="#555349">nest / hoard</text>

<!-- water pool -->
<ellipse cx="266" cy="398" rx="34" ry="7" fill="#DCE8EA" stroke="#7FA0A8"/>
<text x="240" y="418" font-size="10" fill="#6B675E">water</text>

<!-- stalagmites -->
<g fill="#C9BCA4" stroke="#8A7A5E" stroke-width="1">
  <path d="M 470 400 L 478 358 L 486 400 Z"/>
  <path d="M 494 400 L 500 372 L 506 400 Z"/>
</g>

<!-- broken ledge: cut a jump gap through the rock shelf -->
<rect x="626" y="232" width="34" height="168" fill="#FBF8F2"/>
<line x1="626" y1="232" x2="626" y2="400" stroke="#6B5E48" stroke-width="2"/>
<line x1="660" y1="232" x2="660" y2="400" stroke="#6B5E48" stroke-width="2"/>
<path d="M 556 235 L 568 220 L 580 235 Z" fill="#C9BCA4" stroke="#6B5E48" stroke-width="1.5"/>
<path d="M 686 235 L 698 220 L 710 235 Z" fill="#C9BCA4" stroke="#6B5E48" stroke-width="1.5"/>
<text x="584" y="214" font-size="10" fill="#555349">rimrock cover</text>
<text x="590" y="286" font-size="10" font-weight="700" fill="#2A2A2A" text-anchor="middle">
  <tspan x="590" dy="0">BROKEN</tspan>
  <tspan x="590" dy="12">SHELF</tspan>
</text>
<text x="644" y="322" font-size="9" fill="#B4552D" text-anchor="middle" transform="rotate(90 644 322)">jump gap</text>
<g fill="#B4552D">
  <circle cx="660" cy="228" r="2.5"/><circle cx="672" cy="228" r="2.5"/>
</g>
<text x="700" y="286" font-size="9" fill="#6B675E" text-anchor="middle">
  <tspan x="700" dy="0">owner varies</tspan>
  <tspan x="700" dy="11">by occupancy</tspan>
</text>

<!-- climb-dc face -->
<text x="552" y="330" font-size="10" fill="#555349" transform="rotate(-90 552 330)">climb-dc face — the gamble</text>
<g stroke="#B4552D" stroke-width="1.5" fill="none">
  <path d="M 574 392 Q 566 320 570 248"/>
  <path d="M 564 256 L 570 244 L 576 256"/>
</g>

<!-- ramp behind note -->
<path d="M 500 300 Q 540 268 566 244" stroke="#8A7A5E" stroke-width="1.5" stroke-dasharray="6 5" fill="none"/>
<text x="404" y="300" font-size="10" fill="#555349">rubble ramp behind —</text>
<text x="404" y="313" font-size="10" fill="#555349">walk route (≤1h steps)</text>

<!-- upper tunnel -->
<g stroke="#B4552D" stroke-width="1.5" fill="none">
  <line x1="700" y1="212" x2="734" y2="212"/>
  <path d="M 728 206 L 738 212 L 728 218"/>
</g>
<text x="730" y="182" font-size="10" fill="#FBF8F2" text-anchor="end">upper tunnel — the back way</text>

<!-- cutaway + darkness notes -->
<text x="310" y="114" font-size="10" fill="#FBF8F2">overhead shell exists; fixed-camera cutaway omits it</text>
<text x="330" y="130" font-size="10" fill="#FBF8F2">no light-needing inhabitants → no practical fixture; dark forms still read</text>

<!-- room graph -->
<text x="14" y="446" font-size="12" font-weight="700" fill="#2A2A2A">Room graph — two routes up, one loop</text>
<g font-size="10">
  <rect x="14" y="456" width="92" height="26" rx="6" fill="#F4F0E6" stroke="#B9AE94"/>
  <text x="34" y="473" fill="#2A2A2A">MOUTH</text>
  <rect x="176" y="456" width="100" height="26" rx="6" fill="#F4F0E6" stroke="#B9AE94"/>
  <text x="196" y="473" fill="#2A2A2A">CHAMBER</text>
  <rect x="392" y="456" width="88" height="26" rx="6" fill="#F4F0E6" stroke="#B4552D" stroke-width="1.5"/>
  <text x="412" y="473" fill="#2A2A2A">LEDGE</text>
  <rect x="576" y="456" width="120" height="26" rx="6" fill="#F4F0E6" stroke="#B9AE94"/>
  <text x="590" y="473" fill="#2A2A2A">UPPER TUNNEL</text>
</g>
<g stroke="#8A8377" stroke-width="1.5" fill="none">
  <line x1="106" y1="469" x2="176" y2="469"/>
  <line x1="276" y1="462" x2="392" y2="462"/>
  <line x1="480" y1="469" x2="576" y2="469"/>
</g>
<line x1="276" y1="476" x2="392" y2="476" stroke="#B4552D" stroke-width="1.5" stroke-dasharray="4 4"/>
<path d="M 636 482 Q 360 522 60 482" stroke="#8A8377" stroke-width="1.5" stroke-dasharray="6 5" fill="none"/>
<g font-size="9" fill="#6B675E">
  <text x="112" y="459">organic portal</text>
  <text x="292" y="456">ramp: walk</text>
  <text x="288" y="490">climb-dc gamble</text>
  <text x="330" y="506">flank loop</text>
</g>
</svg>
