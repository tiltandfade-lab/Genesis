<svg viewBox="0 0 740 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="rt rd" font-family="ui-sans-serif, -apple-system, 'Segoe UI', sans-serif">
<title id="rt">The four roof shapes and where each goes on the monastery (2026-07-24)</title>
<desc id="rd">Top: four roof types shown from the front and from above — flat walkable deck, single-slope shed, two-slope gable, and the later four-slope hip whose corner joints are the new construction problem. Bottom: the current monastery seed assignment: flat deck to a licensed tower, gable plus spire to the great hall and gatehouse, shed to the covered walkway, and repeating gables to the bedroom range. Hip remains a later culture or estate variant.</desc>
<rect x="0" y="0" width="740" height="480" fill="#FFFFFF"/>

<text x="14" y="22" font-size="13" font-weight="700" fill="#2A2A2A">The roof family — from the front, and from above</text>
<text x="30" y="52" font-size="10" fill="#6B675E">from the front:</text>
<text x="30" y="144" font-size="10" fill="#6B675E">from above:</text>

<!-- FLAT DECK -->
<rect x="30" y="70" width="110" height="52" fill="#E8D9B0" stroke="#7A5A2E" stroke-width="1.5"/>
<rect x="26" y="58" width="10" height="12" fill="#E8D9B0" stroke="#7A5A2E"/>
<rect x="134" y="58" width="10" height="12" fill="#E8D9B0" stroke="#7A5A2E"/>
<line x1="36" y1="70" x2="134" y2="70" stroke="#7A5A2E" stroke-width="2"/>
<rect x="30" y="150" width="110" height="66" fill="#F4F0E6" stroke="#7A5A2E" stroke-width="1.5"/>
<text x="42" y="188" font-size="9" fill="#6B675E">flat, walk on it</text>
<text x="30" y="242" font-size="11" font-weight="700" fill="#2A2A2A">FLAT DECK</text>
<text x="30" y="257" font-size="10" fill="#6B675E">already built</text>

<!-- SHED -->
<rect x="212" y="86" width="110" height="36" fill="#E8D9B0" stroke="#7A5A2E" stroke-width="1.5"/>
<path d="M 208 86 L 326 62 L 326 86 Z" fill="#F4F0E6" stroke="#7A5A2E" stroke-width="1.5"/>
<rect x="212" y="150" width="110" height="66" fill="#F4F0E6" stroke="#7A5A2E" stroke-width="1.5"/>
<g stroke="#8A8377" stroke-width="1" fill="none">
  <line x1="222" y1="160" x2="222" y2="206"/><line x1="252" y1="160" x2="252" y2="206"/>
  <line x1="282" y1="160" x2="282" y2="206"/><line x1="312" y1="160" x2="312" y2="206"/>
</g>
<text x="228" y="188" font-size="9" fill="#6B675E">one slope ↓</text>
<text x="212" y="242" font-size="11" font-weight="700" fill="#2A2A2A">SHED</text>
<text x="212" y="257" font-size="10" fill="#6B675E">already built</text>

<!-- GABLE -->
<rect x="394" y="94" width="110" height="28" fill="#E8D9B0" stroke="#7A5A2E" stroke-width="1.5"/>
<path d="M 390 94 L 449 60 L 508 94 Z" fill="#F4F0E6" stroke="#7A5A2E" stroke-width="1.5"/>
<rect x="394" y="150" width="110" height="66" fill="#F4F0E6" stroke="#7A5A2E" stroke-width="1.5"/>
<line x1="394" y1="183" x2="504" y2="183" stroke="#7A5A2E" stroke-width="2.5"/>
<text x="404" y="176" font-size="9" fill="#6B675E">ridge down the middle</text>
<text x="394" y="242" font-size="11" font-weight="700" fill="#2A2A2A">GABLE</text>
<text x="394" y="257" font-size="10" fill="#6B675E">two slopes — planned</text>

<!-- HIP -->
<rect x="576" y="94" width="110" height="28" fill="#E8D9B0" stroke="#7A5A2E" stroke-width="1.5"/>
<path d="M 572 94 L 606 66 L 656 66 L 690 94 Z" fill="#F4F0E6" stroke="#7A5A2E" stroke-width="1.5"/>
<rect x="576" y="150" width="110" height="66" fill="#F4F0E6" stroke="#7A5A2E" stroke-width="1.5"/>
<line x1="612" y1="183" x2="650" y2="183" stroke="#7A5A2E" stroke-width="2.5"/>
<g stroke="#7A5A2E" stroke-width="1.5">
  <line x1="576" y1="150" x2="612" y2="183"/><line x1="686" y1="150" x2="650" y2="183"/>
  <line x1="576" y1="216" x2="612" y2="183"/><line x1="686" y1="216" x2="650" y2="183"/>
</g>
<g fill="none" stroke="#B4552D" stroke-width="1.5">
  <circle cx="594" cy="167" r="10"/><circle cx="668" cy="167" r="10"/>
  <circle cx="594" cy="199" r="10"/><circle cx="668" cy="199" r="10"/>
</g>
<text x="576" y="242" font-size="11" font-weight="700" fill="#2A2A2A">HIP</text>
<text x="576" y="257" font-size="10" fill="#B4552D">later variant — corner joints</text>

<!-- assignment strip -->
<text x="14" y="296" font-size="13" font-weight="700" fill="#2A2A2A">Who gets which roof on the monastery</text>
<line x1="30" y1="430" x2="710" y2="430" stroke="#555349" stroke-width="2"/>

<rect x="46" y="330" width="52" height="100" fill="#E8D9B0" stroke="#7A5A2E" stroke-width="1.5"/>
<rect x="42" y="320" width="8" height="10" fill="#E8D9B0" stroke="#7A5A2E"/>
<rect x="94" y="320" width="8" height="10" fill="#E8D9B0" stroke="#7A5A2E"/>
<text x="36" y="450" font-size="10" fill="#555349">tower → flat deck</text>
<text x="36" y="464" font-size="9" fill="#6B675E">(militant only)</text>

<rect x="170" y="366" width="190" height="64" fill="#E8D9B0" stroke="#7A5A2E" stroke-width="1.5"/>
<path d="M 164 366 L 265 322 L 366 366 Z" fill="#F4F0E6" stroke="#B4552D" stroke-width="2"/>
<line x1="265" y1="322" x2="265" y2="304" stroke="#B4552D" stroke-width="2"/>
<path d="M 259 309 L 265 298 L 271 309 Z" fill="#F4F0E6" stroke="#B4552D" stroke-width="1.5"/>
<text x="184" y="450" font-size="10" fill="#555349">great hall + gatehouse → GABLE + SPIRE</text>

<rect x="404" y="398" width="120" height="32" fill="#E8D9B0" stroke="#7A5A2E" stroke-width="1.5"/>
<path d="M 400 398 L 528 380 L 528 398 Z" fill="#F4F0E6" stroke="#7A5A2E" stroke-width="1.5"/>
<text x="402" y="450" font-size="10" fill="#555349">walkway → shed</text>

<rect x="566" y="398" width="42" height="32" fill="#E8D9B0" stroke="#7A5A2E" stroke-width="1.5"/>
<path d="M 563 398 L 587 380 L 611 398 Z" fill="#F4F0E6" stroke="#7A5A2E" stroke-width="1.5"/>
<rect x="614" y="398" width="42" height="32" fill="#E8D9B0" stroke="#7A5A2E" stroke-width="1.5"/>
<path d="M 611 398 L 635 380 L 659 398 Z" fill="#F4F0E6" stroke="#7A5A2E" stroke-width="1.5"/>
<rect x="662" y="398" width="42" height="32" fill="#E8D9B0" stroke="#7A5A2E" stroke-width="1.5"/>
<path d="M 659 398 L 683 380 L 707 398 Z" fill="#F4F0E6" stroke="#7A5A2E" stroke-width="1.5"/>
<text x="566" y="450" font-size="10" fill="#555349">bedroom row → gable, repeating</text>
</svg>
